<style>
:root{
  --bg:#0b0d1f;--bg2:#141735;--panel:#1b1f42;--line:rgba(255,255,255,.1);--ink:#fff;--dim:#a3a8d4;
  --p1:#ff5a5f;--p2:#3da9fc;--gold:#ffd23f;--ok:#3ddc84;--ac:#9b5cff;
  --disp:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;--body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
body{font-family:var(--body);color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:manipulation;
  background:radial-gradient(120% 60% at 50% -10%,#2a2f6b 0%,var(--bg) 60%) fixed}
#app{position:fixed;inset:0;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 24px)}
.wrap{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:14px;animation:in .35s ease-out}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1,h2,h3{font-family:var(--disp);font-weight:400;margin:0;letter-spacing:.01em}
p{margin:0;line-height:1.45}
.dim{color:var(--dim)}.center{text-align:center}.grow{flex:1}
.logo{font-family:var(--disp);font-size:54px;line-height:.9;text-align:center;letter-spacing:.02em;text-shadow:0 5px 0 rgba(0,0,0,.35)}
.logo .a{color:var(--p1)}.logo .b{color:var(--gold)}.logo .c{color:var(--p2)}.logo .d{color:#2ec4b6}
.logo small{display:block;font-size:30px;color:#fff;letter-spacing:.35em;margin-top:4px;padding-left:.35em}
.btn{appearance:none;border:0;cursor:pointer;font:400 22px var(--disp);letter-spacing:.03em;color:#fff;background:var(--ac);border-radius:18px;padding:17px 20px;
  box-shadow:0 6px 0 rgba(0,0,0,.35),inset 0 -4px 0 rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;gap:10px;width:100%;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.btn.green{background:#20b774}.btn.gold{background:var(--gold);color:#2a2100}.btn.ghost{background:var(--panel);box-shadow:0 5px 0 rgba(0,0,0,.35)}
.btn:focus-visible,.gcard:focus-visible,.back:focus-visible{outline:3px solid #fff;outline-offset:3px}
.topbar{display:flex;align-items:center;justify-content:space-between;min-height:40px}
.back{appearance:none;border:0;background:var(--panel);color:#fff;border-radius:12px;padding:10px 14px;font:800 14px var(--body);cursor:pointer}
.label{font:900 12px var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px}
/* rivalidad */
.rival{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:12px 14px}
.rival .pl{display:flex;flex-direction:column;gap:2px}.rival .pl:last-child{text-align:right}
.rival .nm{font:400 20px var(--disp)}.rival .w{font:800 12px var(--body);color:var(--dim)}
.rival .vs{font:400 30px var(--disp);letter-spacing:.04em}
.rival button{grid-column:1/-1;appearance:none;border:0;background:transparent;color:var(--dim);font:800 13px var(--body);text-decoration:underline;cursor:pointer;padding:2px}
/* tarjetas de juego */
.gcard{appearance:none;border:0;color:#fff;text-align:left;width:100%;cursor:pointer;display:grid;grid-template-columns:112px 1fr;gap:14px;align-items:center;
  padding:12px;border-radius:24px;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 7px 0 rgba(0,0,0,.35),inset 0 -5px 0 rgba(0,0,0,.15);transition:transform .08s}
.gcard:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(0,0,0,.35)}
.gcard svg{width:112px;height:112px;display:block;border-radius:18px}
.gcard h3{font-size:27px;line-height:1}
.gcard p{font:800 14px/1.3 var(--body);opacity:.92;margin-top:6px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tags span{font:900 11px var(--body);letter-spacing:.06em;text-transform:uppercase;background:rgba(0,0,0,.25);padding:4px 8px;border-radius:8px}
/* info */
.hero{display:flex;gap:14px;align-items:center}
.hero svg{width:96px;height:96px;flex:none;border-radius:18px}
.hero h2{font-size:36px;line-height:1}
.steps{display:grid;gap:10px}
.step{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;background:var(--panel);border-radius:16px;padding:12px 14px}
.step b.n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--ac);font:400 18px var(--disp)}
.step p{font-weight:700}
.goal{background:linear-gradient(90deg,rgba(255,210,63,.18),rgba(255,210,63,.05));border:1px solid rgba(255,210,63,.35);border-radius:16px;padding:12px 14px;font-weight:800}
.phone{display:block;margin:0 auto;width:170px;height:auto}
.setup{display:flex;gap:10px;align-items:center;background:var(--bg2);border-radius:16px;padding:10px 12px;font-weight:800;font-size:14px}
.setup svg{flex:none}
.stick{position:sticky;bottom:0;padding:12px 0 4px;margin-top:4px;background:linear-gradient(transparent,var(--bg) 35%)}
.or{display:flex;align-items:center;gap:10px;color:var(--dim);font:800 13px var(--body)}.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.codein{width:100%;background:var(--bg2);border:2px solid var(--line);border-radius:16px;color:#fff;font:400 44px var(--disp);letter-spacing:.35em;text-align:center;padding:10px 0 10px .35em;text-transform:uppercase;user-select:text;-webkit-user-select:text}
.codein:focus{outline:none;border-color:var(--gold)}
.code{font:400 44px var(--disp);letter-spacing:.3em;padding-left:.3em;color:var(--gold)}.code.big{font-size:68px;background:var(--panel);border-radius:22px;padding:14px 0 14px .3em;border:2px dashed rgba(255,210,63,.5)}
.dots4{display:flex;justify-content:center;gap:10px}.dots4 i{width:14px;height:14px;border-radius:50%;animation:bob 1.2s ease-in-out infinite}

body:not(.tplay):not(.playing) #mute{background:var(--u-2);border-radius:50%;box-shadow:inset 0 0 0 1px var(--u-l)}

<script>

"use strict";
/* =====================================================================
   ARENA MINI 2 · juegos de acción para 2 personas en el mismo celular
   - Motor: un <canvas> a pantalla completa, bucle con requestAnimationFrame
   - Jugador 1 (Rojo) abajo, Jugador 2 (Azul) arriba: su zona se dibuja
     girada 180° para que la lea quien está sentado enfrente.
   - Cada juego = { id, name, need, pads, lay(), newRound(first),
                    update(dt, live), draw(), hud(i,w,h)?, view(i,f) }
   ===================================================================== */
const $ = (q, el = document) => el.querySelector(q);
const h = html => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const rnd = (a, b) => a + Math.random() * (b - a), ri = (a, b) => Math.floor(rnd(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v, TAU = Math.PI * 2;
const pick = a => a[Math.floor(Math.random() * a.length)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const COL = ["#ff5a5f", "#3da9fc", "#ffd23f", "#2ec4b6", "#9b5cff", "#ff8a3d", "#ff6bd6", "#a3e635", "#22d3ee", "#c08457", "#cbd5e1", "#e11d48"], COL_D = ["#c0353b", "#1f74bd", "#c9a012", "#1d8c81", "#6b3bc4", "#c85f1c", "#c23fa3", "#6e9e1c", "#1597ab", "#8a5a33", "#8a95a8", "#9f1239"], COL_L = ["#ffc2c3", "#c3e4ff", "#fff0b3", "#b8f2ec", "#d9c4ff", "#ffd0b0", "#ffc8f0", "#e0f7b8", "#b8f3fb", "#ecd3bd", "#eef2f7", "#fecdd3"];
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a})`; };
const vib = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch {} };

const KEY = "arena-mini-2";
let S = Object.assign({ names: ["Rojo", "Azul"], wins: {}, muted: false, me: "", onl: [0, 0] },
  (() => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } })());
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };
const nm = i => (E.net && NET.pname(i)) || S.names[i] || (i ? "Azul" : "Rojo");
const ONL = () => !!E.net, ROT = () => !!E.net && E.net.me === 1 && !(E.game && E.game.noFlip);

/* ---------------- sonido sintetizado ---------------- */
let ac = null, master = null, noiseBuf = null;
function audio() {
  if (!ac) {
    const A = window.AudioContext || window.webkitAudioContext; if (!A) return null;
    ac = new A(); master = ac.createGain(); master.gain.value = .9;
    const cp = ac.createDynamicsCompressor(); master.connect(cp).connect(ac.destination);
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (ac.state !== "running") ac.resume().catch(() => {});
  return ac;
}
addEventListener("pointerdown", () => { try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch {} audio(); }, { once: true });
function tone(f, d = .12, type = "sine", v = .2, delay = 0, to = null) {
  if (S.muted) return; const c = audio(); if (!c) return;
  const t = c.currentTime + .01 + delay, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + d);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g).connect(master); o.start(t); o.stop(t + d + .05);
}
function noise(d, v, f0, f1, delay = 0) {
  if (S.muted) return; const c = audio(); if (!c) return;
  const t = c.currentTime + .01 + delay, s = c.createBufferSource(), fl = c.createBiquadFilter(), g = c.createGain();
  s.buffer = noiseBuf; fl.type = "lowpass"; fl.frequency.setValueAtTime(f0, t); fl.frequency.exponentialRampToValueAtTime(f1, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  s.connect(fl).connect(g).connect(master); s.start(t); s.stop(t + d + .05);
}
let lastSnd = {};
const lim = (k, ms, f) => { const n = performance.now(); if (n - (lastSnd[k] || 0) < ms) return; lastSnd[k] = n; f(); };
const sfx = {
  tap: () => tone(520, .06, "triangle", .14, 0, 820),
  count: n => tone(n ? 440 : 880, n ? .12 : .35, "square", .12),
  boom: () => lim("boom", 60, () => { noise(.7, .6, 2600, 70); tone(95, .45, "sine", .4, 0, 38); }),
  place: () => tone(170, .09, "triangle", .25, 0, 110),
  pick: () => [660, 880, 1320].forEach((f, i) => tone(f, .1, "triangle", .16, i * .05)),
  die: () => { tone(620, .55, "sawtooth", .1, 0, 60); noise(.3, .25, 1500, 200); },
  shoot: () => lim("sh", 40, () => tone(1300, .1, "square", .05, 0, 260)),
  hit: () => { noise(.18, .4, 3500, 300); tone(240, .18, "square", .1, 0, 80); },
  block: () => lim("bl", 50, () => noise(.08, .25, 1800, 500)),
  shield: () => tone(900, .2, "sine", .15, 0, 1800),
  puck: v => lim("pk", 35, () => tone(260 + v * 2, .05, "triangle", clamp(.08 + v / 900, .08, .3))),
  wall: () => lim("wl", 40, () => tone(180, .05, "triangle", .1)),
  goal: () => { noise(.4, .3, 4000, 600); [523, 784, 1047].forEach((f, i) => tone(f, .2, "square", .1, i * .08)); },
  win: () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .22, "triangle", .2, i * .09)),
  lose: () => [392, 330, 262].forEach((f, i) => tone(f, .25, "triangle", .15, i * .12)),
  fan: () => [392, 523, 659, 784, 659, 784, 1047].forEach((f, i) => tone(f, .26, "square", .08, i * .12)),
  sudden: () => [880, 660, 880, 660].forEach((f, i) => tone(f, .14, "square", .1, i * .16)),
};
const $mute = $("#mute");
const drawMute = () => $mute.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#fff"/>${S.muted ? '<path d="M17 9l5 6M22 9l-5 6"/>' : '<path d="M17 8.5a5 5 0 0 1 0 7M19.5 6a8.5 8.5 0 0 1 0 12"/>'}</svg>`;
$mute.onclick = () => { S.muted = !S.muted; save(); drawMute(); };
drawMute();
document.addEventListener("pointerdown", e => { if (e.target.closest(".btn,.gcard,.back")) sfx.tap(); });

/* ---------------- lienzo y utilidades de dibujo ---------------- */
const cv = $("#cv"), cx = cv.getContext("2d");
let W = innerWidth, H = innerHeight, DPR = 1;
function resize() { DPR = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); }
addEventListener("resize", resize); resize();
const FD = px => `400 ${px}px "Lilita One","Arial Rounded MT Bold",sans-serif`, FB = px => `900 ${px}px Nunito,"Segoe UI",sans-serif`;
function txt(s, x, y, px, col = "#fff", al = "center", font = FD) { cx.font = font(px); cx.fillStyle = col; cx.textAlign = al; cx.textBaseline = "middle"; cx.fillText(s, x, y); }
function rr(x, y, w, hh, r) { cx.beginPath(); cx.roundRect ? cx.roundRect(x, y, w, hh, r) : cx.rect(x, y, w, hh); }
function circ(x, y, r) { cx.beginPath(); cx.arc(x, y, r, 0, TAU); }
function upTxt(s, x, y, px, col) { cx.save(); cx.translate(x, y); if (ROT()) cx.rotate(Math.PI); txt(s, 0, 0, px, col); cx.restore(); }

/* íconos dibujados (centro x,y; tamaño s) */
function icBomb(x, y, s) {
  cx.fillStyle = "#15151c"; circ(x, y + s * .08, s * .38); cx.fill();
  cx.fillStyle = "rgba(255,255,255,.35)"; circ(x - s * .13, y - s * .05, s * .1); cx.fill();
  cx.strokeStyle = "#caa36b"; cx.lineWidth = Math.max(1, s * .08); cx.lineCap = "round";
  cx.beginPath(); cx.moveTo(x + s * .18, y - s * .2); cx.quadraticCurveTo(x + s * .25, y - s * .38, x + s * .36, y - s * .38); cx.stroke();
  cx.fillStyle = "#ffd23f"; circ(x + s * .38, y - s * .4, s * .09); cx.fill();
}
function icFire(x, y, s) {
  cx.fillStyle = "#ff7a1a"; cx.beginPath(); cx.moveTo(x, y + s * .45);
  cx.bezierCurveTo(x - s * .42, y + s * .4, x - s * .38, y - s * .05, x - s * .1, y - s * .45);
  cx.bezierCurveTo(x - s * .05, y - s * .15, x + s * .12, y - s * .1, x + s * .12, y - s * .3);
  cx.bezierCurveTo(x + s * .42, y - s * .05, x + s * .42, y + s * .4, x, y + s * .45); cx.fill();
  cx.fillStyle = "#ffd23f"; cx.beginPath(); cx.moveTo(x, y + s * .42); cx.bezierCurveTo(x - s * .2, y + s * .38, x - s * .18, y + s * .1, x, y - s * .05); cx.bezierCurveTo(x + s * .18, y + s * .1, x + s * .2, y + s * .38, x, y + s * .42); cx.fill();
}
function icBolt(x, y, s) {

/* ---------------- partículas (coordenadas de pantalla) ---------------- */

    PS.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, l: life * (.6 + Math.random() * .4), m: life, sz: sz * (.6 + Math.random() * .7), c: Array.isArray(col) ? col[k % col.length] : col, g }); }

/* =====================================================================
   CONTROLES TÁCTILES: cada jugador tiene una zona (abajo/arriba).
   Lado izquierdo de SU zona = joystick/deslizador · lado derecho = botón.
   Coordenadas locales (u,v): v=0 junto al tablero, v=ch en su borde.
   ===================================================================== */
const Pads = {
  ch: 160,
  p: [0, 1].map(() => ({ stick: null, btn: null, fire: 0, drag: 0, kx: 0, ky: 0, kf: false, nx: 0, ny: 0, nh: false })),
  reset() { this.p.forEach(p => { p.stick = null; p.btn = null; p.fire = 0; p.drag = 0; }); },
  zoneOf(y) { return y > H - this.ch ? 0 : y < this.ch ? 1 : -1; },

  R() { return clamp(this.ch * .2, 30, 46); },

  move(id, x, y) {
    this.p.forEach((p, i) => {

  up(id) { for (const p of this.p) { if (p.stick && p.stick.id === id) p.stick = null; if (p.btn && p.btn.id === id) p.btn = null; } },

  takeDrag(i) { const d = this.p[i].drag; this.p[i].drag = 0; return d; },

/* teclado (para compu): Rojo = WASD + Espacio · Azul = flechas + Enter */
const KB = { KeyW: [0, 0, -1], KeyS: [0, 0, 1], KeyA: [0, -1, 0], KeyD: [0, 1, 0], ArrowUp: [1, 0, -1], ArrowDown: [1, 0, 1], ArrowLeft: [1, -1, 0], ArrowRight: [1, 1, 0] };
const keys = new Set();

    cx.fillStyle = "rgba(255,255,255,.45)";

  if (!p.stick) { cx.fillStyle = "rgba(255,255,255,.35)"; for (let k = 0; k < 4; k++) { const a = k * Math.PI / 2; cx.save(); cx.translate(ou + Math.cos(a) * (R + 2), ov + Math.sin(a) * (R + 2)); cx.rotate(a); cx.beginPath(); cx.moveTo(5, 0); cx.lineTo(-3, -6); cx.lineTo(-3, 6); cx.closePath(); cx.fill(); cx.restore(); } }

/* =====================================================================
   MOTOR DE PARTIDA
   st: off → count (3·2·1) → play → end (banner) → count … → resultado
   ===================================================================== */
const E = { st: "off", game: null, t: 0, wins: [0, 0], first: true, lw: -1, go: 0, shake: 0, prev: null, net: null };
function startMatch(g, online) {
  E.net = online ? { role: "host", me: 0 } : null; NETIN.tx = NETIN.mx = NETIN.my = null; Pads.p.forEach(p => { p.nx = p.ny = 0; p.nh = false; });
  if (online) { NET.game = g.id; NET.gseats = NET.seats().slice(0, 2); NET.pi = 0; NET.send({ k: "start", game: g.id, opt: g.getOpt ? g.getOpt() : null, seats: NET.gseats }); }
  E.game = g; E.wins = [0, 0]; E.first = true; document.body.classList.add("playing");
  $("#app").replaceChildren(); cv.classList.add("on"); resize(); newRound();
}
function newRound() {
  PS = []; Pads.reset(); E.game.lay(); E.game.newRound(E.first);
  E.st = E.game.quick && !E.first ? "play" : "count"; E.t = 0; E.go = 0;
}
function endRound(w) {
  if (E.st !== "play") return;
  E.st = "end"; E.t = 0; E.lw = w; E.first = false;
  if (w >= 0) E.wins[w]++;
  endSounds();
}
function endSounds() {
  const w = E.lw, over = E.wins[0] >= E.game.need || E.wins[1] >= E.game.need, mine = !E.net || w === E.net.me;
  setTimeout(() => over ? (mine ? sfx.fan() : sfx.lose()) : w >= 0 ? (mine ? (E.game.quick ? sfx.goal() : sfx.win()) : sfx.lose()) : sfx.lose(), E.game.quick ? 0 : 350);
}
function stopMatch() { E.st = "off"; E.net = null; cv.classList.remove("on"); $("#pause").classList.remove("on"); document.body.classList.remove("playing"); keys.clear(); kbSync(); }
function pause(fromNet) {
  if (E.st === "off" || E.st === "pause") return; E.prev = E.st; E.st = "pause";
  $("#pz-re").style.display = E.net ? "none" : ""; $("#pz-q").textContent = E.net ? "Salir de la partida" : "Salir al menú";
  $("#pz-who").textContent = fromNet === true ? `${nm(1 - E.net.me)} pausó el juego` : ""; $("#pause").classList.add("on");
  if (E.net && fromNet !== true) NET.send({ k: "pause", on: 1 });
}
function resume(fromNet) {
  if (E.st !== "pause") return; $("#pause").classList.remove("on"); E.st = E.prev || "play";
  if (E.net && fromNet !== true) NET.send({ k: "pause", on: 0 });
}
$("#pz-go").onclick = () => resume();
$("#pz-re").onclick = () => { $("#pause").classList.remove("on"); startMatch(E.game); };
$("#pz-q").onclick = () => {
  if (E.net) { const host = E.net.role === "host"; stopMatch(); if (host) NET.send({ k: "lobby" }); else NET.send({ k: "leave" }); lobby(); return; }
  stopMatch(); home();
};
document.addEventListener("visibilitychange", () => { if (document.hidden && (E.st === "play" || E.st === "count")) pause(); });

/* entrada táctil sobre el lienzo (multitoque con pointerId) */
const pt = e => ROT() ? [W - e.clientX, H - e.clientY] : [e.clientX, e.clientY];
const spots = () => { const s = E.game.pauseSpots(); return E.net && s.length === 2 ? [s[E.net.me]] : s; };
cv.addEventListener("pointerdown", e => {
  e.preventDefault(); if (E.st === "off" || E.st === "pause") return;
  const [x, y] = pt(e);
  for (const [px, py] of spots()) if (Math.hypot(x - px, y - py) < 24) { pause(); return; }
  try { cv.setPointerCapture(e.pointerId); } catch {}
  if (E.game.pads) Pads.down(e.pointerId, x, y); else E.game.down(e.pointerId, x, y);
});
cv.addEventListener("pointermove", e => { if (E.st === "off") return; const [x, y] = pt(e); if (E.game.pads) Pads.move(e.pointerId, x, y); else E.game.move(e.pointerId, x, y); });
const ptrUp = e => { if (!E.game) return; if (E.game.pads) Pads.up(e.pointerId); else E.game.up(e.pointerId); };
cv.addEventListener("pointerup", ptrUp); cv.addEventListener("pointercancel", ptrUp); cv.addEventListener("lostpointercapture", ptrUp);
cv.addEventListener("contextmenu", e => e.preventDefault());

let lastT = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  if (E.st === "off" || E.st === "pause") { lastT = ts; return; }
  const dt = Math.min(.034, Math.max(0, (ts - lastT) / 1000)); lastT = ts;
  if (E.net && E.net.role === "guest") guestStep(dt); else step(dt);
  render();
  if (E.net) NET.tick(ts);
}
function guestStep(dt) {
  const g = E.game, p = Pads.p[E.net.me]; g.lay();
  NET.inAcc += p.fire; p.fire = 0;
  g.guestTick(dt); stepParts(dt); E.shake = Math.max(0, E.shake - dt);
}
requestAnimationFrame(frame);
function step(dt) {
  const g = E.game; g.lay();
  if (E.st === "count") {
    const p = E.t; E.t += dt;
    for (let k = 0; k < 3; k++) { const at = .5 + k * .8; if (p < at && E.t >= at) sfx.count(3 - k); }
    if (E.t >= 2.9) { E.st = "play"; E.t = 0; E.go = .7; sfx.count(0); }
    g.update(dt, false);
  } else if (E.st === "play") { g.update(dt, true); if (E.go > 0) E.go -= dt; }
  else if (E.st === "end") {
    g.update(dt, false); E.t += dt;
    if (E.t >= (g.quick ? 1.3 : 2.8)) { if (E.wins[0] >= g.need || E.wins[1] >= g.need) finish(); else newRound(); }
  }
  stepParts(dt); E.shake = Math.max(0, E.shake - dt);
}
function render() {
  const g = E.game;
  cx.setTransform(DPR, 0, 0, DPR, 0, 0); cx.fillStyle = "#0b0d1f"; cx.fillRect(0, 0, W, H);
  if (ROT()) { cx.translate(W, H); cx.rotate(Math.PI); }
  cx.save(); if (E.shake > 0) { const a = E.shake * 22; cx.translate(rnd(-a, a), rnd(-a, a)); }
  g.draw(); drawParts(); cx.restore();
  if (g.pads) for (const i of [0, 1]) withZone(i, (w, hh) => g.hud(i, w, hh, !!E.net && i !== E.net.me));
  for (const [x, y] of spots()) { circ(x, y, 15); cx.fillStyle = "rgba(0,0,0,.45)"; cx.fill(); cx.strokeStyle = "rgba(255,255,255,.35)"; cx.lineWidth = 1.5; cx.stroke(); cx.fillStyle = "#fff"; if (g.rot) { cx.fillRect(x - 6, y - 5, 12, 3.5); cx.fillRect(x - 6, y + 1.5, 12, 3.5); } else { cx.fillRect(x - 5, y - 6, 3.5, 12); cx.fillRect(x + 1.5, y - 6, 3.5, 12); } }
  for (const i of E.net ? [E.net.me] : [0, 1]) g.view(i, (w, hh) => overlay(i, w, hh));
}
/* cuenta regresiva y carteles, cada uno orientado hacia su jugador */
function panel(w, hh, ph) { const pw = Math.min(w - 28, 330), y = hh / 2 - ph / 2; rr((w - pw) / 2, y, pw, ph, 20); cx.fillStyle = "rgba(9,11,28,.9)"; cx.fill(); cx.strokeStyle = "rgba(255,255,255,.15)"; cx.lineWidth = 2; cx.stroke(); }
function overlay(i, w, hh) {
  const g = E.game;
  if (E.st === "count") {
    if (E.t < .5) { panel(w, hh, 84); txt(g.name.toUpperCase(), w / 2, hh / 2 - 10, 28, "#fff"); txt(E.first ? `Gana quien llegue a ${g.need}` : `Ronda ${E.wins[0] + E.wins[1] + 1}`, w / 2, hh / 2 + 20, 15, "#a3a8d4", "center", FB); }
    else { const n = 3 - Math.floor((E.t - .5) / .8), f = ((E.t - .5) % .8) / .8; cx.globalAlpha = 1 - f * .6; txt(String(n), w / 2, hh / 2, 70 + (1 - f) * 30, "#fff"); cx.globalAlpha = 1; }
  } else if (E.st === "play" && E.go > 0) { cx.globalAlpha = clamp(E.go / .3, 0, 1); txt("¡YA!", w / 2, hh / 2, 64, "#ffd23f"); cx.globalAlpha = 1; }
  else if (E.st === "end") {
    const w8 = E.lw, over = E.wins[0] >= g.need || E.wins[1] >= g.need, me = w8 === i;
    const big = g.quick ? (me ? "¡GOL!" : "Te anotaron") : w8 < 0 ? "¡EMPATE!" : over ? (me ? "¡GANASTE!" : "Perdiste") : me ? "¡Ronda tuya!" : "Ronda perdida";
    panel(w, hh, 104); txt(big, w / 2, hh / 2 - 16, 34, w8 < 0 ? "#fff" : me ? "#ffd23f" : "#a3a8d4");
    const a = E.wins[i], b = E.wins[1 - i];
    txt(w8 < 0 ? "Nadie suma. Otra vez." : `Tú ${a}  ·  ${b} ${nm(1 - i)}`, w / 2, hh / 2 + 24, 16, "#fff", "center", FB);
  }
}
function finish() {
  const g = E.game, w = E.wins[0] > E.wins[1] ? 0 : 1, sc = E.wins.slice();
  if (E.net) { NET.send({ k: "result", w, sc }); stopMatch(); resultOnline(w, sc); return; }
  S.wins[g.id] = S.wins[g.id] || [0, 0]; S.wins[g.id][w]++; save();
  stopMatch(); result(g, w, sc);
}

/* =====================================================================
   RED · salas con código (2 a 10 personas), cada uno en su celular
   - Principal: WebRTC directo (PeerJS, sin servidor propio)
   - Respaldo: relé MQTT público por WebSocket, si la conexión directa falla
   - Pruebas: BroadcastChannel (?local=1)
   El ANFITRIÓN (asiento 0) manda: simula el juego y reparte el estado.
   Cada invitado tiene un asiento (1..9) y un id propio (gid).
   ===================================================================== */
const LIBS = {
  peer: ["https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js", "https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"],
  mqtt: ["https://cdn.jsdelivr.net/npm/mqtt@5.16.0/dist/mqtt.min.js", "https://unpkg.com/mqtt@5.16.0/dist/mqtt.min.js"],
};

/* =====================================================================
   LUDO · 2 a 4 jugadores. Recorrido de 52 casillas + carril final de 5 + meta.

/* =====================================================================
   ÚLTIMA CARTA · juego de cartas de colores (reglas clásicas, diseño propio)

const CARDS = {
  id: "cartas", name: "Última Carta", kind: "turn", need: 1, maxp: 4, hidden: true, pick: null,
  CN: { r: "rojo", y: "amarillo", g: "verde", b: "azul" }, CC: { r: "#ff5a5f", y: "#ffc93c", g: "#22b8a7", b: "#3d8bfc" },
  deck() {
    const d = [];
    for (const c of "rygb") { d.push(c + "0"); for (const v of "123456789SRD") d.push(c + v, c + v); }
    for (let k = 0; k < 4; k++) d.push("W", "F");
    for (let i = d.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [d[i], d[j]] = [d[j], d[i]]; }
    return d;
  },
  init(round, np) {
    const pile = this.deck(), hands = Array.from({ length: np }, () => pile.splice(0, 7));
    let top; for (;;) { top = pile.shift(); if (/^[rygb]\d$/.test(top)) break; pile.push(top); }

  wild: c => c === "W" || c === "F",

  ok(s, c) { if (this.wild(c)) return true; const t = this.top(s); return c[0] === s.col || (!this.wild(t) && c.slice(1) === t.slice(1)); },
  step(s, p, k = 1) { return ((p + s.dir * k) % s.np + s.np) % s.np; },
  draw1(s) {
    if (!s.pile.length) { const t = s.disc.pop(); s.pile = s.disc; s.disc = [t]; for (let i = s.pile.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [s.pile[i], s.pile[j]] = [s.pile[j], s.pile[i]]; } }
    return s.pile.shift();
  },
  give(s, p, n) { for (let k = 0; k < n; k++) { const c = this.draw1(s); if (c) s.hands[p].push(c); } },
  move(s, p, a) {
    if (s.w !== null) return null;
    if (a.uno) {
      if (s.unoP === p) { s.unoP = null; s.msg = `¡${tname(p)} dijo ÚLTIMA!`; s.n++; return s; }
      if (s.turn === p && s.hands[p].length === 2 && !s.called[p]) { s.called[p] = true; s.msg = `¡${tname(p)} dijo ÚLTIMA!`; s.n++; return s; }

    }
    if (a.unopen) { if (s.unoP === null) return null; this.give(s, s.unoP, 2); s.msg = `${tname(s.unoP)} no dijo ÚLTIMA: roba 2`; s.last = { pen: s.unoP }; s.unoP = null; s.n++; return s; }

    if (a.pass) { if (s.drew === null) return null; s.turn = this.step(s, p); s.drew = null; s.msg = `${tname(p)} pasó`; s.n++; return s; }

    const c = h[i]; if (!this.ok(s, c)) return null;

    if (h.length === 1 && !s.called[p]) { s.unoP = p; s.unoAt = Date.now() + 2600; } s.called[p] = false;

  sym(v) {

    if (!file) return;
    const P = $(".bt-panel"); const note = () => $(".bt-note", P);
    try {
      if (note()) note().textContent = "Preparando…";
      const r = await MEDIA.prepare(file), id = Math.random().toString(36).slice(2, 10);
      if (!T.online) { MEDIA.put(id, r.type, r.blob ? URL.createObjectURL(r.blob) : await MEDIA.toBlobURL(r.data)); ctx.act({ media: { id, type: r.type }, p: s.target }); this.autoOpen = id; return; }
      MEDIA.put(id, r.type, await MEDIA.toBlobURL(r.data)); this.sent = id;
      await MEDIA.send(id, r.type, r.data, f => { if (note()) note().textContent = `Enviando a todos… ${Math.round(f * 100)}%`; });
      ctx.act({ media: { id, type: r.type }, p: s.target });
    } catch (e) { toast(e.message || "No se pudo subir"); if (note()) note().textContent = "No se pudo enviar. Intenta con una foto o un video más corto."; }
  },
};

/* =====================================================================
   CITY FORTUNE · MOTOR DE JUEGO (sin DOM, sin interfaz)
   Solo el anfitrión (o el celular local) ejecuta CF.act(). Los demás
   solo piden acciones: ROLL · BUY · DECLINE · END_TURN · PAY_FINE ·
   USE_CARD · PAY_RENT · USE_PROTECTION · BUILD · SELL_BUILDING ·
   MORTGAGE · UNMORTGAGE · SELL_PROPERTY · BID · AUC_PASS ·
   TRADE_PROPOSE · TRADE_ACCEPT · TRADE_REJECT · PAY_DEBT ·
   DECLARE_BANKRUPTCY   (+ aid para no procesar dos veces)
   Dados, dinero, dueños, rentas, posición y ganador los decide el motor.
   Submódulos: estado · turnos · economía · propiedades · construcción ·
   hipotecas · eventos · detención · subastas · negociación · deudas y
   bancarrota · victoria · filtro de privacidad
   ===================================================================== */
const CF = (() => {
  const T40 = CF_TILES.length;
  const E = (s, k, o) => s.ev.push(Object.assign({ k }, o || {}));          // evento para la animación
  const nm = (s, p) => (s.names && s.names[p]) || "Jugador " + (p + 1);
  const money = n => "$" + n.toLocaleString("es");
  function log(s, txt, p) { s.log.push({ n: s.n, txt, p: p ?? -1 }); if (s.log.length > s.r.logSize) s.log.splice(0, s.log.length - s.r.logSize); }

  /* ---------- azar (solo en el estado del anfitrión; nunca se envía a los invitados) ---------- */
  function rand(s) { let t = (s.rng = (s.rng + 0x6D2B79F5) >>> 0); t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
  const rollDie = s => 1 + Math.floor(rand(s) * 6);
  function rollDice(s) { return [rollDie(s), rollDie(s)]; }
  function shuffle(s, a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand(s) * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  const newSeed = () => { try { return crypto.getRandomValues(new Uint32Array(1))[0]; } catch { return (Math.random() * 4294967296) >>> 0; } };
  const merge = (a, b) => { const o = JSON.parse(JSON.stringify(a)); for (const k in b || {}) o[k] = (b[k] && typeof b[k] === "object" && !Array.isArray(b[k]) && o[k] && typeof o[k] === "object") ? merge(o[k], b[k]) : b[k]; return o; };

  /* =================== ESTADO =================== */
  function newGame({ np, names, rules, seed }) {
    np = Math.max(2, Math.min(6, np | 0));
    const r = merge(CF_RULES, rules);
    const s = {
      v: 1, gid: Math.random().toString(36).slice(2, 10), n: 0, np, names: (names || []).slice(0, np).map(String), r,
      phase: "turn", turn: 0, round: 1, turnNo: 1, dc: 0, dice: null, again: false, pend: -1, rq: null,
      players: Array.from({ length: np }, () => ({ cash: r.startingMoney, pos: 0, jail: false, jt: 0, cards: [], out: false })),
      own: Array(T40).fill(-1), lvl: Array(T40).fill(0), mort: Array(T40).fill(false),
      pot: 0, decks: {}, rng: (seed ?? newSeed()) >>> 0, log: [], tx: [], ev: [], evn: 0, aids: {}, acts: [], w: null, why: "",
      debts: [], resume: null, auc: null, trade: null, tradeBack: null, tid: 0,
      st: Array.from({ length: np }, () => ({ rentPaid: 0, rentGot: 0, bought: 0, spent: 0, jailed: 0, laps: 0, taxes: 0, cards: 0, built: 0, trades: 0, auctions: 0, mortgages: 0 })),
    };
    s.seed0 = s.rng;
    for (const d of ["city", "market"]) s.decks[d] = shuffle(s, CF_CARDS.filter(c => c.deck === d && (!c.needs || r.features[c.needs])).map(c => c.id));
    log(s, `Empieza la partida. Cada jugador recibe ${money(r.startingMoney)}.`);
    E(s, "TURN", { p: 0 });
    return s;
  }

  /* =================== ECONOMÍA (toda operación de dinero pasa por aquí) =================== */
  function transfer(s, from, to, amt, why) {
    amt = Math.round(amt); if (!(amt > 0)) return;
    if (typeof from === "number") s.players[from].cash -= amt; else if (from === "pot") s.pot -= amt;
    if (typeof to === "number") s.players[to].cash += amt; else if (to === "pot") s.pot += amt;
    s.tx.push({ n: s.n, from, to, amt, why }); if (s.tx.length > s.r.txSize) s.tx.splice(0, s.tx.length - s.r.txSize);
    E(s, "$", { from, to, amt, why });
  }
  const sink = s => s.r.festivalPot ? "pot" : "bank";
  /* cobra: si alcanza, paga. Si no, pero vendiendo/hipotecando podría, queda una DEUDA que debe
     resolver antes de seguir. Si ni así alcanza: bancarrota. */
  const owedBy = (s, p) => s.debts.reduce((a, d) => a + (d.p === p ? d.amt : 0), 0);
  function liquidity(s, p) {
    let v = s.players[p].cash;
    for (let i = 0; i < T40; i++) if (s.own[i] === p) { const t = CF_TILES[i]; v += Math.floor(s.lvl[i] * (t.cost || 0) * s.r.building.sellRate); if (!s.mort[i]) v += t.mortgage; }
    return v;
  }
  function pay(s, p, to, amt, why) {
    amt = Math.round(amt); if (!(amt > 0)) return true;
    const pl = s.players[p]; if (pl.out) return false;
    const owed = owedBy(s, p);
    if (!owed && pl.cash >= amt) { transfer(s, p, to, amt, why); return true; }
    if (s.r.features.mortgage && liquidity(s, p) - owed >= amt) {
      s.debts.push({ p, to, amt, why }); E(s, "DEBT", { p, to, amt });
      log(s, `${nm(s, p)} debe ${money(amt)} (${why}) y no tiene suficiente efectivo: tiene que vender o hipotecar.`, p); return true;
    }
    bankrupt(s, p, typeof to === "number" ? to : "bank", amt); return false;
  }
  const gain = (s, p, amt, why) => transfer(s, "bank", p, amt, why);
  function assets(s, p) {
    const pl = s.players[p]; let prop = 0, build = 0, debt = 0, count = 0;
    for (let i = 0; i < T40; i++) if (s.own[i] === p) { const t = CF_TILES[i]; count++; prop += t.price; build += s.lvl[i] * (t.cost || 0); if (s.mort[i]) debt += t.mortgage; }
    return { cash: pl.cash, prop, build, debt, count, net: pl.out ? 0 : pl.cash + prop + build - debt };
  }

  /* =================== PROPIEDADES =================== */
  const controls = (s, o, d) => o >= 0 && CF_DISTRICTS[d].tiles.every(i => s.own[i] === o);
  const countType = (s, o, type) => CF_TILES.filter(t => t.type === type && s.own[t.pos] === o).length;
  const levelRent = (s, pos, lv) => Math.round(CF_TILES[pos].base * s.r.levelMult[lv] / 5) * 5;
  function rentFor(s, pos, ctx = {}) {
    const t = CF_TILES[pos], o = s.own[pos], r = s.r; if (o < 0 || s.mort[pos]) return 0;
    if (t.type === "PROPERTY") { const lv = s.lvl[pos]; return lv > 0 ? levelRent(s, pos, lv) : t.base * (controls(s, o, t.d) ? r.districtControlMult : 1); }
    if (t.type === "TRANSPORT") return r.transportRent[countType(s, o, "TRANSPORT") - 1] * (ctx.mult || 1);
    if (t.type === "UTILITY") return (ctx.roll || 0) * (ctx.utilX || r.utilityMult[countType(s, o, "UTILITY") - 1]);
    return 0;
  }
  function buyProperty(s, p, pos) {
    const t = CF_TILES[pos];
    transfer(s, p, "bank", t.price, "compra"); s.own[pos] = p; s.st[p].bought++; s.st[p].spent += t.price;
    E(s, "BUY", { p, pos }); log(s, `${nm(s, p)} compró ${t.name} por ${money(t.price)}.`, p);
    if (t.type === "PROPERTY" && controls(s, p, t.d)) { E(s, "DISTRICT", { p, d: t.d }); log(s, `¡${nm(s, p)} controla todo ${CF_DISTRICTS[t.d].name}! Sus rentas se duplican.`, p); }
  }

  /* =================== MOVIMIENTO =================== */
  function moveBy(s, p, steps) {
    const pl = s.players[p], from = pl.pos, to = ((from + steps) % T40 + T40) % T40;
    pl.pos = to; E(s, "MOVE", { p, from, to, steps });
    if (steps > 0 && from + steps >= T40) { s.st[p].laps++; gain(s, p, s.r.passStartReward, "salida"); E(s, "START", { p }); log(s, `${nm(s, p)} pasó por la Estación Central y cobró ${money(s.r.passStartReward)}.`, p); }
  }
  const moveTo = (s, p, target) => moveBy(s, p, ((target - s.players[p].pos) + T40) % T40 || T40);
  function toDetention(s, p, why) {
    const pl = s.players[p], from = pl.pos; pl.pos = 10; pl.jail = true; pl.jt = 0; s.dc = 0; s.st[p].jailed++;
    E(s, "MOVE", { p, from, to: 10, jump: true }); E(s, "JAIL", { p }); log(s, `${nm(s, p)} va al Centro de Detención${why ? " (" + why + ")" : ""}.`, p);
  }
  const release = (s, p) => { const pl = s.players[p]; pl.jail = false; pl.jt = 0; E(s, "FREE", { p }); };

  /* =================== CASILLAS =================== */
  function resolveTile(s, p, ctx = {}, depth = 0) {
    const pl = s.players[p]; if (pl.out || depth > 3) return;
    const pos = pl.pos, t = CF_TILES[pos];
    E(s, "LAND", { p, pos });
    switch (t.type) {
      case "PROPERTY": case "TRANSPORT": case "UTILITY": {
        const o = s.own[pos];
        if (o < 0) { s.phase = "buy"; s.pend = pos; return; }
        if (o === p) return;
        if (s.mort[pos]) { log(s, `${t.name} está hipotecada: no se paga alquiler.`, p); return; }
        if (t.type === "UTILITY" && ctx.utilX) { const d = rollDice(s); ctx.roll = d[0] + d[1]; E(s, "ROLL", { p, d, card: true }); }
        const amt = rentFor(s, pos, ctx); if (amt > 0) chargeRent(s, p, o, amt, pos);

      }
      case "TAX": {
        let amt = t.amount; const k = findCard(s, p, "TAX_DISCOUNT");
        if (k >= 0) { amt = Math.ceil(amt / 2); useCard(s, p, k); log(s, `${nm(s, p)} usó un cupón: el impuesto le cuesta la mitad.`, p); }
        s.st[p].taxes += Math.min(amt, pl.cash);
        if (pay(s, p, sink(s), amt, "impuesto")) { E(s, "TAX", { p, amt }); log(s, `${nm(s, p)} pagó ${money(amt)} de ${t.name}.`, p); }
        return;
      }
      case "EVENT": return drawCard(s, p, t.deck, depth);
      case "GO_TO_DETENTION": return toDetention(s, p, "inspección");
      case "BONUS": if (s.pot > 0) { const a = s.pot; transfer(s, "pot", p, a, "festival"); E(s, "POT", { p, amt: a }); log(s, `¡${nm(s, p)} se llevó el bote del Festival: ${money(a)}!`, p); } return;
      default: return;
    }
  }
  function chargeRent(s, p, o, amt, pos) {
    if (findCard(s, p, "RENT_PROTECTION") >= 0) { s.phase = "rentq"; s.rq = { o, amt, pos }; return; }
    payRent(s, p, o, amt, pos);
  }
  function payRent(s, p, o, amt, pos) {
    const had = s.players[p].cash;
    if (pay(s, p, o, amt, "alquiler")) { s.st[p].rentPaid += amt; s.st[o].rentGot += amt; E(s, "RENT", { p, o, amt, pos }); log(s, `${nm(s, p)} pagó ${money(amt)} de alquiler a ${nm(s, o)} por ${CF_TILES[pos].name}.`, p); }
    else { s.st[p].rentPaid += had; s.st[o].rentGot += had; }
  }

  /* =================== EVENTOS (cartas) =================== */
  const findCard = (s, p, kind) => s.players[p].cards.findIndex(id => CF_CARDS[id].keep === kind);
  function useCard(s, p, k) { const id = s.players[p].cards.splice(k, 1)[0]; s.decks[CF_CARDS[id].deck].push(id); E(s, "USE", { p, id }); return id; }
  function drawCard(s, p, deck, depth) {
    const D = s.decks[deck]; if (!D.length) return;
    const id = D.shift(), c = CF_CARDS[id], pl = s.players[p], others = s.players.map((q, i) => i).filter(i => i !== p && !s.players[i].out);
    s.st[p].cards++;
    E(s, "CARD", { p, id }); log(s, `${nm(s, p)}: «${c.title}»`, p);
    if (c.type !== "KEEP") D.push(id);
    switch (c.type) {
      case "GAIN": gain(s, p, c.value, "evento"); break;
      case "PAY": pay(s, p, sink(s), c.value, "evento"); break;
      case "ALL_PAY_POT": for (const i of s.players.map((q, i) => i)) if (!s.players[i].out) pay(s, i, sink(s), c.value, "evento"); break;
      case "COLLECT_EACH": for (const q of others) pay(s, q, p, c.value, "evento"); break;
      case "PAY_EACH": for (const q of others) if (!pay(s, p, q, c.value, "evento")) break; break;
      case "GAIN_PER_PROPERTY": { const n = s.own.filter(o => o === p).length; if (n) gain(s, p, n * c.value, "evento"); else log(s, `${nm(s, p)} no tiene propiedades: no recibe nada.`, p); break; }
      case "PAY_PER_BUILDING": { let tot = 0; s.own.forEach((o, i) => { if (o === p) tot += s.lvl[i] * c.value + (s.lvl[i] >= 4 ? c.top : 0); }); if (tot) pay(s, p, sink(s), tot, "evento"); else log(s, `${nm(s, p)} no tiene construcciones: no paga nada.`, p); break; }
      case "MOVE_TO": moveTo(s, p, c.value); resolveTile(s, p, { roll: s.dice ? s.dice[0] + s.dice[1] : 7 }, depth + 1); break;
      case "MOVE_BACK": moveBy(s, p, -c.value); resolveTile(s, p, { roll: s.dice ? s.dice[0] + s.dice[1] : 7 }, depth + 1); break;

      }
      case "GO_DETENTION": toDetention(s, p, "evento"); break;
      case "KEEP": pl.cards.push(id); log(s, `${nm(s, p)} guarda la tarjeta «${CF_KEEP[c.keep].name}».`, p); break;
    }
  }

  /* =================== BANCARROTA ===================
     Solo llega aquí si ni vendiendo todo alcanza, o si el jugador se rinde.
     Construcciones → se venden al banco; efectivo y propiedades → al acreedor
     (o al banco, que las deja libres y sin hipoteca). */
  function bankrupt(s, p, creditor, owed) {
    const pl = s.players[p]; if (pl.out) return;
    const toP = typeof creditor === "number" && creditor !== p && !s.players[creditor].out;
    for (let i = 0; i < T40; i++) if (s.own[i] === p && s.lvl[i] > 0) { gain(s, p, Math.floor(s.lvl[i] * CF_TILES[i].cost * s.r.building.sellRate), "venta"); s.lvl[i] = 0; }
    s.debts = s.debts.filter(d => d.p !== p);
    // si estaba en una subasta o en un trato pendiente, se limpia
    if (s.auc) {
      const A = s.auc;
      if (p === s.turn) { s.auc = null; s.phase = "moving"; }
      else { const k = A.act.indexOf(p); if (k >= 0) { A.act.splice(k, 1); if (k < A.i) A.i--; } if (A.lead === p) { A.lead = -1; A.bid = 0; } }
    }
    if (s.trade && (s.trade.from === p || s.trade.to === p)) { s.phase = s.tradeBack; s.trade = null; s.tradeBack = null; }
    if (pl.cash > 0) transfer(s, p, toP ? creditor : "bank", pl.cash, "quiebra");
    for (let i = 0; i < T40; i++) if (s.own[i] === p) { if (toP) s.own[i] = creditor; else { s.own[i] = -1; s.lvl[i] = 0; s.mort[i] = false; } }
    while (pl.cards.length) useCard(s, p, 0);
    pl.out = true; pl.cash = 0; pl.jail = false;
    E(s, "BANKRUPT", { p, to: toP ? creditor : -1 });
    log(s, `💥 ${nm(s, p)} quebró (debía ${money(owed)}). ${toP ? `Sus propiedades pasan a ${nm(s, creditor)}.` : "Sus propiedades vuelven al banco."}`, p);
    checkVictory(s);
  }

  /* =================== CONSTRUCCIÓN · HIPOTECAS · VENTAS (validadores) ===================
     Devuelven null si se puede, o el motivo. La interfaz y la IA usan estos mismos. */
  const okPos = pos => Number.isInteger(pos) && pos >= 0 && pos < T40;
  const dTiles = pos => CF_DISTRICTS[CF_TILES[pos].d].tiles;
  const unmortCost = (s, pos) => Math.round(CF_TILES[pos].mortgage * (1 + s.r.mortgage.interest));
  const check = {
    build(s, p, pos, free) {
      if (!s.r.features.build) return "disabled"; if (!okPos(pos)) return "tile";
      const t = CF_TILES[pos]; if (t.type !== "PROPERTY") return "tile"; if (s.own[pos] !== p) return "owner";
      if (!controls(s, p, t.d)) return "district"; const D = dTiles(pos);
      if (D.some(i => s.mort[i])) return "mortgaged"; if (s.lvl[pos] >= s.r.building.maxLevel) return "max";
      if (s.r.building.evenBuild && s.lvl[pos] > Math.min(...D.map(i => s.lvl[i]))) return "even";
      if (!free && s.players[p].cash < t.cost) return "cash"; return null;
    },
    sell(s, p, pos) {
      if (!okPos(pos)) return "tile"; const t = CF_TILES[pos]; if (t.type !== "PROPERTY" || s.own[pos] !== p) return "owner";
      if (s.lvl[pos] <= 0) return "none"; if (s.r.building.evenBuild && s.lvl[pos] < Math.max(...dTiles(pos).map(i => s.lvl[i]))) return "even"; return null;
    },
    mortgage(s, p, pos) {
      if (!s.r.features.mortgage) return "disabled"; if (!okPos(pos)) return "tile"; const t = CF_TILES[pos];
      if (!CF_OWNABLE(t) || s.own[pos] !== p) return "owner"; if (s.mort[pos]) return "already";
      if (t.type === "PROPERTY" && dTiles(pos).some(i => s.lvl[i] > 0)) return "buildings"; return null;
    },
    unmortgage(s, p, pos) {
      if (!okPos(pos)) return "tile"; if (s.own[pos] !== p) return "owner"; if (!s.mort[pos]) return "not";
      if (s.players[p].cash < unmortCost(s, pos)) return "cash"; return null;
    },
    sellProp(s, p, pos) {
      if (!s.r.sellToBank.enabled) return "disabled"; if (!okPos(pos)) return "tile"; const t = CF_TILES[pos];
      if (!CF_OWNABLE(t) || s.own[pos] !== p) return "owner"; if (s.mort[pos]) return "mortgaged";
      if (t.type === "PROPERTY" && dTiles(pos).some(i => s.lvl[i] > 0)) return "buildings"; return null;
    },
    /* negociación: todo lo ofrecido debe existir y ser de quien lo ofrece */
    trade(s, from, o) {
      if (!s.r.features.trade) return "disabled";
      const to = o.to; if (!Number.isInteger(to) || to < 0 || to >= s.np || to === from || s.players[to].out) return "target";
      const side = (who, x) => {
        if (x.cash > s.players[who].cash) return "cash";
        for (const pos of x.props) { if (!okPos(pos) || s.own[pos] !== who) return "owner"; if (CF_TILES[pos].type === "PROPERTY" && dTiles(pos).some(i => s.lvl[i] > 0)) return "buildings"; }
        for (const id of x.cards) if (!s.players[who].cards.includes(id)) return "card";

      };

      if (!o.give.cash && !o.get.cash && !o.give.props.length && !o.get.props.length && !o.give.cards.length && !o.get.cards.length) return "empty";
      const fee = props => props.reduce((a, pos) => a + (s.mort[pos] ? Math.round(CF_TILES[pos].mortgage * s.r.trade.mortgageFee) : 0), 0);
      if (s.players[from].cash - o.give.cash + o.get.cash < fee(o.get.props)) return "fee";
      if (s.players[to].cash - o.get.cash + o.give.cash < fee(o.give.props)) return "fee";
      return null;
    },
  };
  function normTrade(a) {
    const side = x => {
      x = x && typeof x === "object" ? x : {};
      const cash = x.cash === undefined ? 0 : x.cash, props = Array.isArray(x.props) ? x.props : [], cards = Array.isArray(x.cards) ? x.cards : [];
      if (!Number.isInteger(cash) || cash < 0 || cash > 1e6) return null;
      if (props.length > 28 || cards.length > 10 || !props.every(Number.isInteger) || !cards.every(Number.isInteger)) return null;
      if (new Set(props).size !== props.length || new Set(cards).size !== cards.length) return null;
      return { cash, props: props.slice(), cards: cards.slice() };
    };
    const give = side(a.give), get = side(a.get); if (!give || !get) return null;
    return { to: a.to, give, get };
  }
  function build(s, p, pos, free) {
    const t = CF_TILES[pos]; if (!free) transfer(s, p, "bank", t.cost, "construcción");
    s.lvl[pos]++; s.st[p].built++; E(s, "BUILD", { p, pos, lvl: s.lvl[pos], free: !!free });
    log(s, `${nm(s, p)} construyó ${CF_LEVELS[s.lvl[pos]] === "Local" ? "un Local" : CF_LEVELS[s.lvl[pos]] === "Edificio" ? "un Edificio" : CF_LEVELS[s.lvl[pos]] === "Torre" ? "una Torre" : "un Complejo"} en ${t.name}${free ? " gratis" : ` por ${money(t.cost)}`}.`, p);
  }

  /* =================== SUBASTAS (por turnos: ofertar o retirarse) =================== */
  function startAuction(s, pos, from) {
    const a = alive(s), k = a.indexOf(from), order = a.slice(k + 1).concat(a.slice(0, k + 1));
    s.auc = { pos, bid: 0, lead: -1, act: order, i: 0 }; s.phase = "auction";
    E(s, "AUCTION", { pos }); log(s, `🔨 Subasta de ${CF_TILES[pos].name}. Empieza en ${money(s.r.auction.minBid)}.`);
  }
  function aucNext(s, removed) {
    const A = s.auc; if (!removed) A.i++;
    if (!A.act.length || (A.act.length === 1 && A.act[0] === A.lead)) return aucEnd(s);
    A.i %= A.act.length; if (A.act[A.i] === A.lead) A.i = (A.i + 1) % A.act.length;
  }
  function aucEnd(s) {
    const A = s.auc, t = CF_TILES[A.pos];
    if (A.lead >= 0) {
      transfer(s, A.lead, "bank", A.bid, "subasta"); s.own[A.pos] = A.lead; s.st[A.lead].auctions++; s.st[A.lead].spent += A.bid;
      E(s, "AUC_WON", { p: A.lead, pos: A.pos, amt: A.bid }); log(s, `🔨 ${nm(s, A.lead)} ganó la subasta: ${t.name} por ${money(A.bid)}.`, A.lead);
      if (t.type === "PROPERTY" && controls(s, A.lead, t.d)) { E(s, "DISTRICT", { p: A.lead, d: t.d }); log(s, `¡${nm(s, A.lead)} controla todo ${CF_DISTRICTS[t.d].name}! Sus rentas se duplican.`, A.lead); }
    } else { E(s, "AUC_NONE", { pos: A.pos }); log(s, `Nadie ofertó por ${t.name}: sigue libre.`); }
    s.auc = null; s.phase = "moving"; afterMove(s, s.turn, s.again);
  }
  const minBid = s => s.auc.lead < 0 ? s.r.auction.minBid : s.auc.bid + s.r.auction.minInc;

  /* =================== VICTORIA =================== */
  const alive = s => s.players.map((q, i) => i).filter(i => !s.players[i].out);
  function checkVictory(s) {
    const a = alive(s); if (s.phase === "over") return true;
    if (a.length === 1) { finish(s, a[0], "last"); return true; }
    return false;
  }
  function finish(s, w, why) {
    s.w = w; s.why = why; s.phase = "over"; s.pend = -1; s.rq = null;
    E(s, "WIN", { p: w, why }); log(s, why === "last" ? `🏆 ${nm(s, w)} es el último empresario en pie. ¡Gana la partida!` : `🏆 Se acabaron las rondas: ${nm(s, w)} tiene el mayor patrimonio. ¡Gana!`, w);
  }
  function richest(s) { let best = -1, bv = -1; for (const i of alive(s)) { const v = assets(s, i).net; if (v > bv) { bv = v; best = i; } } return best; }

  /* =================== TURNOS =================== */
  function afterMove(s, p, extra) {
    const pl = s.players[p];
    if (s.phase === "over" || pl.out) return;
    if (s.phase === "buy" || s.phase === "rentq") { s.again = extra; return; }
    if (pl.jail) { s.phase = "done"; return; }
    s.phase = extra ? "turn" : "done";
    if (extra) { E(s, "AGAIN", { p }); log(s, `¡Dobles! ${nm(s, p)} tira otra vez.`, p); }
  }
  function nextTurn(s) {
    s.dc = 0; s.pend = -1; s.rq = null; s.again = false; s.auc = null; s.trade = null;
    const a = alive(s); if (a.length < 2) return checkVictory(s);
    let i = s.turn; do i = (i + 1) % s.np; while (s.players[i].out);
    if (i <= s.turn) {
      s.round++;
      if (s.r.victory.mode === "rounds" && s.round > s.r.victory.maxRounds) { s.round = s.r.victory.maxRounds; finish(s, richest(s), "rounds"); return; }
    }
    s.turn = i; s.turnNo++; s.phase = "turn"; s.dice = null;
    E(s, "TURN", { p: i });
  }

  /* =================== ACCIONES =================== */
  const H = {
    ROLL(s, p) {
      if (s.phase !== "turn") return "phase";
      const pl = s.players[p], d = rollDice(s), tot = d[0] + d[1], dbl = d[0] === d[1];
      s.dice = d; E(s, "ROLL", { p, d }); log(s, `${nm(s, p)} sacó ${d[0]} y ${d[1]}.`, p);
      if (pl.jail) {
        if (dbl && s.r.detention.doublesRelease) { release(s, p); log(s, `¡Dobles! ${nm(s, p)} sale del Centro de Detención.`, p); }
        else if (++pl.jt >= s.r.detention.maxTurns) {
          if (!pay(s, p, sink(s), s.r.detention.fine, "fianza")) return;
          release(s, p); log(s, `${nm(s, p)} cumplió ${s.r.detention.maxTurns} turnos: paga ${money(s.r.detention.fine)} y sale.`, p);
        } else { log(s, `${nm(s, p)} sigue en el Centro de Detención (intento ${pl.jt} de ${s.r.detention.maxTurns}).`, p); s.phase = "done"; return; }
        moveBy(s, p, tot); resolveTile(s, p, { roll: tot }); afterMove(s, p, false); return;
      }
      if (dbl) { s.dc++; if (s.dc >= s.r.maxDoubles) { toDetention(s, p, `${s.r.maxDoubles} dobles seguidos`); s.phase = "done"; return; } }
      moveBy(s, p, tot); resolveTile(s, p, { roll: tot }); afterMove(s, p, dbl && s.r.doublesExtraRoll);
    },
    BUY(s, p) {
      if (s.phase !== "buy" || s.pend < 0) return "phase";
      const t = CF_TILES[s.pend];
      if (s.players[p].pos !== s.pend || s.own[s.pend] !== -1) return "tile";
      if (s.players[p].cash < t.price) return "cash";
      buyProperty(s, p, s.pend); s.pend = -1; s.phase = "moving"; afterMove(s, p, s.again);
    },
    DECLINE(s, p) {
      if (s.phase !== "buy" || s.pend < 0) return "phase";
      log(s, `${nm(s, p)} no compró ${CF_TILES[s.pend].name}.`, p); E(s, "DECLINE", { p, pos: s.pend });
      const pos = s.pend; s.pend = -1;
      if (s.r.features.auction && alive(s).length > 1) return void startAuction(s, pos, p);
      s.phase = "moving"; afterMove(s, p, s.again);
    },
    PAY_RENT(s, p) {
      if (s.phase !== "rentq" || !s.rq) return "phase";
      const q = s.rq; s.rq = null; s.phase = "moving"; payRent(s, p, q.o, q.amt, q.pos); afterMove(s, p, s.again);
    },
    USE_PROTECTION(s, p) {
      if (s.phase !== "rentq" || !s.rq) return "phase";
      const k = findCard(s, p, "RENT_PROTECTION"); if (k < 0) return "card";
      const q = s.rq; s.rq = null; s.phase = "moving"; useCard(s, p, k);
      E(s, "PROTECT", { p, o: q.o, amt: q.amt }); log(s, `${nm(s, p)} usó su seguro y no pagó ${money(q.amt)} a ${nm(s, q.o)}.`, p); afterMove(s, p, s.again);
    },
    PAY_FINE(s, p) {
      const pl = s.players[p];
      if (s.phase !== "turn" || !pl.jail) return "phase";
      if (pl.cash < s.r.detention.fine) return "cash";
      transfer(s, p, sink(s), s.r.detention.fine, "fianza"); release(s, p); log(s, `${nm(s, p)} pagó ${money(s.r.detention.fine)} y salió del Centro de Detención.`, p);
    },
    USE_CARD(s, p, a) {
      const pl = s.players[p], kind = String(a.card || ""), k = findCard(s, p, kind);
      if (k < 0) return "card";

const FB_CFG = { apiKey: "", projectId: "" };                 // se completa al conectar Firebase

    const l = await this.query("reviews", ["g", g]);
    if (this.list) { this.list = this.list.filter(r => r.g !== g).concat(l); rvPut(RV_CACHE_K, { at: this.at, list: this.list }); }
    return l;
  },

    const r = await fetch(`${this.base()}:commit?key=${FB_CFG.apiKey}`, { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + token }, body: JSON.stringify(body) });

    if (!r.ok) throw new Error("del");

    await fetch(`${this.base()}:commit?key=${FB_CFG.apiKey}`, { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + token }, body: JSON.stringify(body) }).catch(() => {});
  },
  async delMine() {                                             // borrar todas mis reseñas
    if (!FB_ON()) { const n = rvJSON(RV_LOCAL_K, []).length; rvPut(RV_LOCAL_K, null); return n; }

const RV_STAR = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z"/></svg>`;
const rvStars = (v, cls = "") => `<span class="rv-st ${cls}" role="img" aria-label="${(Math.round(v * 10) / 10).toString().replace(".", ",")} de 5 estrellas">${[1, 2, 3, 4, 5].map(k => `<i class="${v >= k - .25 ? "on" : v >= k - .75 ? "half" : ""}">${RV_STAR}</i>`).join("")}</span>`;
const rvAvg = v => v.toFixed(1).replace(".", ",");
function rvAgo(t) {
  const d = (Date.now() - t) / 1000;
  if (d < 90) return "hace un momento"; if (d < 3600) return `hace ${Math.round(d / 60)} min`; if (d < 86400) return `hace ${Math.round(d / 3600)} h`;
  if (d < 86400 * 30) { const n = Math.round(d / 86400); return `hace ${n} día${n > 1 ? "s" : ""}`; }
  return new Date(t).toLocaleDateString("es", { day: "numeric", month: "short", year: "numeric" });
}

}

/* ============================ PRIVACIDAD ============================ */
function privacy() {
  const back = UI_LAST;
  const v = show(`<div class="topbar"><button class="back" id="bk">‹ Volver</button></div>
    <div class="ui-head"><h1>Política de privacidad</h1><p>Última actualización: 26 de septiembre de 2026</p></div>
    <div class="pp">

      <h3>1. Lo que se guarda en tu celular</h3>
      <p>Tu nombre, los nombres de los jugadores, tus victorias, los ajustes (como el sonido), las partidas guardadas de City Fortune y un identificador anónimo. Todo esto queda en el almacenamiento de tu navegador y no se envía a ningún servidor, salvo lo que se explica abajo. Puedes borrarlo cuando quieras desde <b>Perfil → Borrar datos de este celular</b>.</p>
      <h3>2. Opiniones y calificaciones</h3>
      <p>Cuando publicas una opinión se guardan: las estrellas, el comentario, el nombre que escribas (puede ser inventado o quedar vacío), la fecha y un identificador anónimo al azar que sirve para que solo tú puedas editarla o borrarla. Se guardan en <b>Google Firebase</b> y <b>cualquier persona puede verlas</b>. No escribas datos personales como tu teléfono, dirección o correo.</p>
      <p>Los comentarios con insultos, enlaces o datos personales se rechazan automáticamente, y cualquiera puede reportar un comentario. Podemos borrar comentarios que no respeten estas reglas.</p>
      <h3>3. Jugar en línea</h3>
      <p>Para jugar en línea, los celulares se conectan directamente entre sí (WebRTC). Para encontrarse usan el servicio público de <b>PeerJS</b> y, si la conexión directa no se puede, relés públicos (<b>EMQX</b> y <b>HiveMQ</b>). Por ahí pasan tu nombre y las jugadas, pero Arena Mini no los guarda. Como en cualquier conexión por internet, esos servicios y los otros jugadores de la sala pueden ver tu dirección IP.</p>
      <h3>4. Fotos, videos y voz</h3>
      <p>Las fotos y videos de Botellita y Yo Nunca Nunca, y el chat de voz, van directo a los celulares de la sala. No se guardan en ningún servidor de Arena Mini, y las fotos y videos se borran de la partida al terminar el turno. Recuerda que otra persona siempre podría tomar una captura de pantalla: comparte solo lo que te sientas cómodo compartiendo.</p>
      <h3>5. Otros servicios que usa la página</h3>
      <p>La página está alojada en <b>GitHub Pages</b>, carga las letras desde <b>Google Fonts</b> y algunas herramientas desde <b>jsDelivr</b> y <b>unpkg</b>. Estos servicios pueden registrar datos técnicos como tu dirección IP según sus propias políticas. Arena Mini no usa herramientas de análisis ni de rastreo.</p>
      <h3>6. Menores de edad</h3>
      <p>Las preguntas picantes (+18) vienen apagadas y el anfitrión debe confirmar que todos son mayores de edad para activarlas. Si eres menor de 13 años, no publiques opiniones.</p>
      <h3>7. Tus opciones</h3>
      <p>Puedes editar o borrar tu opinión desde el juego, o borrar todas tus opiniones desde <b>Perfil → Borrar mis opiniones</b>. Si borras los datos de tu celular antes, se pierde el identificador anónimo y ya no podrás borrarlas tú mismo.</p>
      <p><b>Contacto:</b> pronto agregaremos un correo para dudas y solicitudes de privacidad.</p>

  $("#bk", v).onclick = uiBack;
