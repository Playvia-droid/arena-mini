<style>:root{--bg:#0b0d1f;--bg2:#141735;--panel:#1b1f42;--line:rgba(255,255,255,.1);--ink:#fff;--dim:#a3a8d4;--p1:#ff5a5f;--p2:#3da9fc;--gold:#ffd23f;--ok:#3ddc84;--ac:#9b5cff;--disp:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;--body:"Nunito","Segoe UI",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
body{font-family:var(--body);color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:manipulation;background:radial-gradient(120% 60% at 50% -10%,#2a2f6b 0%,var(--bg) 60%) fixed}
#app{position:fixed;inset:0;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 24px)}
.wrap{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:14px;animation:in .35s ease-out}
@keyframes in{from{opacity:0;transform:translateY(10px)}
to{opacity:1;transform:none}
}
h1,h2,h3{font-family:var(--disp);font-weight:400;margin:0;letter-spacing:.01em}
p{margin:0;line-height:1.45}
.dim{color:var(--dim)}
.center{text-align:center}
.grow{flex:1}
.logo{font-family:var(--disp);font-size:54px;line-height:.9;text-align:center;letter-spacing:.02em;text-shadow:0 5px 0 rgba(0,0,0,.35)}
.logo .a{color:var(--p1)}
.logo .b{color:var(--gold)}
.logo .c{color:var(--p2)}
.logo .d{color:#2ec4b6}
.logo small{display:block;font-size:30px;color:#fff;letter-spacing:.35em;margin-top:4px;padding-left:.35em}
.btn{appearance:none;border:0;cursor:pointer;font:400 22px var(--disp);letter-spacing:.03em;color:#fff;background:var(--ac);border-radius:18px;padding:17px 20px;box-shadow:0 6px 0 rgba(0,0,0,.35),inset 0 -4px 0 rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;gap:10px;width:100%;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.btn.green{background:#20b774}
.btn.gold{background:var(--gold);color:#2a2100}
.btn.ghost{background:var(--panel);box-shadow:0 5px 0 rgba(0,0,0,.35)}
.btn:focus-visible,.gcard:focus-visible,.back:focus-visible{outline:3px solid #fff;outline-offset:3px}
.topbar{display:flex;align-items:center;justify-content:space-between;min-height:40px}
.back{appearance:none;border:0;background:var(--panel);color:#fff;border-radius:12px;padding:10px 14px;font:800 14px var(--body);cursor:pointer}
.label{font:900 12px var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px}
.rival{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:12px 14px}
.rival .pl{display:flex;flex-direction:column;gap:2px}
.rival .pl:last-child{text-align:right}
.rival .nm{font:400 20px var(--disp)}
.rival .w{font:800 12px var(--body);color:var(--dim)}
.rival .vs{font:400 30px var(--disp);letter-spacing:.04em}
.rival button{grid-column:1/-1;appearance:none;border:0;background:transparent;color:var(--dim);font:800 13px var(--body);text-decoration:underline;cursor:pointer;padding:2px}
.gcard{appearance:none;border:0;color:#fff;text-align:left;width:100%;cursor:pointer;display:grid;grid-template-columns:112px 1fr;gap:14px;align-items:center;padding:12px;border-radius:24px;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 7px 0 rgba(0,0,0,.35),inset 0 -5px 0 rgba(0,0,0,.15);transition:transform .08s}
.gcard:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(0,0,0,.35)}
.gcard svg{width:112px;height:112px;display:block;border-radius:18px}
.gcard h3{font-size:27px;line-height:1}
.gcard p{font:800 14px/1.3 var(--body);opacity:.92;margin-top:6px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tags span{font:900 11px var(--body);letter-spacing:.06em;text-transform:uppercase;background:rgba(0,0,0,.25);padding:4px 8px;border-radius:8px}
.hero{display:flex;gap:14px;align-items:center}
.hero svg{width:96px;height:96px;flex:none;border-radius:18px}
.hero h2{font-size:36px;line-height:1}
.steps{display:grid;gap:10px}
.step{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;background:var(--panel);border-radius:16px;padding:12px 14px}
.step b.n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--ac);font:400 18px var(--disp)}
.step p{font-weight:700}
.goal{background:linear-gradient(90deg,rgba(255,210,63,.18),rgba(255,210,63,.05));border:1px solid rgba(255,210,63,.35);border-radius:16px;padding:12px 14px;font-weight:800}
.phone{display:block;margin:0 auto;width:170px;height:auto}
.setup{display:flex;gap:10px;align-items:center;background:var(--bg2);border-radius:16px;padding:10px 12px;font-weight:800;font-size:14px}
.setup svg{flex:none}
.stick{position:sticky;bottom:0;padding:12px 0 4px;margin-top:4px;background:linear-gradient(transparent,var(--bg) 35%)}
.or{display:flex;align-items:center;gap:10px;color:var(--dim);font:800 13px var(--body)}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.codein{width:100%;background:var(--bg2);border:2px solid var(--line);border-radius:16px;color:#fff;font:400 44px var(--disp);letter-spacing:.35em;text-align:center;padding:10px 0 10px .35em;text-transform:uppercase;user-select:text;-webkit-user-select:text}
.codein:focus{outline:none;border-color:var(--gold)}
.code{font:400 44px var(--disp);letter-spacing:.3em;padding-left:.3em;color:var(--gold)}
.code.big{font-size:68px;background:var(--panel);border-radius:22px;padding:14px 0 14px .3em;border:2px dashed rgba(255,210,63,.5)}
.dots4{display:flex;justify-content:center;gap:10px}
.dots4 i{width:14px;height:14px;border-radius:50%;animation:bob 1.2s ease-in-out infinite}
.dots4 i:nth-child(2){animation-delay:.15s}
.dots4 i:nth-child(3){animation-delay:.3s}
@keyframes bob{50%{transform:translateY(-8px)}
}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);transform:translateX(-50%);background:#fff;color:#0b0d1f;font-weight:900;padding:12px 18px;border-radius:12px;z-index:90;animation:in .25s;max-width:90vw;text-align:center}
.btn[disabled]{cursor:default}
.toast{pointer-events:none}
.btn small{display:block;font:800 12px var(--body);opacity:.85;letter-spacing:0}
.topbar{padding-right:50px;gap:10px}
.topbar .label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ggrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gcard.sm{grid-template-columns:1fr;text-align:center;padding:10px;gap:8px}
.gcard.sm svg{width:100%;height:auto;aspect-ratio:1}
.gcard.sm h3{font-size:22px}
.gcard.sm .tags{justify-content:center}
.row{display:flex;gap:10px}
.row>*{flex:1}
.chip{appearance:none;border:2px solid var(--line);background:var(--bg2);color:#fff;border-radius:14px;padding:12px 0;font:400 22px var(--disp);cursor:pointer}
.chip.on{border-color:#fff;background:var(--ac)}
.chip[disabled]{opacity:.45;cursor:default}
body.tplay #app{padding:calc(env(safe-area-inset-top,0px) + 10px) 10px calc(env(safe-area-inset-bottom,0px) + 12px)}
.tg{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:10px;position:relative}
.tg-bar{display:flex;align-items:center;gap:10px;padding-right:50px}
.tg-title{font:400 22px var(--disp);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tg-score{font:400 22px var(--disp);display:flex;gap:6px;align-items:center}
.tg-score i{font-style:normal;color:var(--dim);font-size:14px}
.tg-main{flex:1;display:flex;flex-direction:column}
.tg-ov{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:30;pointer-events:none;width:min(92vw,380px)}
.tg-ban{background:rgba(9,11,28,.94);border:2px solid rgba(255,255,255,.15);border-radius:22px;padding:18px;text-align:center;display:grid;gap:6px;animation:pop .45s cubic-bezier(.2,1.5,.4,1)}
.tg-ban b{font:400 34px var(--disp)}
.tg-ban.big b{font-size:42px}
.tg-ban span{font-weight:800;color:var(--dim)}
.pass{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:30px 10px}
.pass-dot{width:90px;height:90px;border-radius:50%;box-shadow:0 0 0 10px rgba(255,255,255,.08)}
.pass h2{font-size:34px}
.pass p{font-weight:800}
.pass .btn{max-width:340px}
.tk{display:flex;flex-direction:column;gap:14px;align-items:center;padding-top:6px}
.tk-players{display:flex;gap:10px;width:100%}
.tk-p{flex:1;display:flex;align-items:center;gap:8px;background:var(--bg2);border-radius:16px;padding:8px 12px;border:2px solid transparent;font-weight:900}
.tk-p .mk{width:30px;height:30px}
.tk-p small{margin-left:auto;color:var(--dim)}
.tk-p.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,var(--bg2))}
.tk-turn{font:400 24px var(--disp);min-height:30px}
.tk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(92vw,400px);aspect-ratio:1}
.tk-c{appearance:none;border:0;border-radius:20px;background:var(--panel);box-shadow:inset 0 -5px 0 rgba(0,0,0,.25);cursor:pointer;padding:12%;display:grid;place-items:center}
.tk-c:not([disabled]):active{transform:scale(.96)}
.tk-c[disabled]{cursor:default}
.tk-c.win{background:#3b3060;box-shadow:0 0 0 3px #ffd23f}
.mk{width:100%;height:100%}

.score{display:flex;justify-content:center;align-items:center;gap:18px;font:400 64px var(--disp)}
.score span:first-child{color:var(--p1)}
.score span:last-child{color:var(--p2)}
.score i{font-style:normal;color:var(--dim);font-size:40px}
#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:none;z-index:40}
#cv.on{display:block}
#pause{position:fixed;inset:0;z-index:60;background:rgba(8,10,26,.86);display:none;place-items:center;padding:24px}
#pause.on{display:grid}
#pause .box{width:min(340px,100%);display:grid;gap:12px;text-align:center}
#fx{position:fixed;inset:0;pointer-events:none;z-index:70}
.vc-row{display:flex;align-items:center;gap:8px;min-height:44px}
.vc-join{flex:1;border:0;border-radius:14px;padding:11px 12px;font:900 15px var(--body);color:#fff;background:linear-gradient(135deg,#7b5cff,#3d8bfc);box-shadow:0 3px 0 rgba(0,0,0,.25);cursor:pointer}
.vc-join:disabled{opacity:.7}
.vc-mic,.vc-x,.vc-tap{border:0;border-radius:12px;height:40px;min-width:44px;font-size:20px;background:#22c55e;color:#fff;cursor:pointer;flex:none}
.vc-mic.off{background:#ef4444}
.vc-x{background:var(--panel);font-size:15px;font-weight:900}
.vc-tap{background:#ffb627;color:#2a2100;font:900 13px var(--body);padding:0 10px}
.vc-ppl{flex:1;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:3px 2px}
.vc-ppl::-webkit-scrollbar{display:none}
.vc-p{position:relative;display:flex;align-items:center;gap:5px;background:var(--panel);border-radius:20px;padding:3px 9px 3px 3px;flex:none;transition:box-shadow .12s}
.vc-p i{width:26px;height:26px;border-radius:50%;background:var(--c);display:grid;place-items:center;font:900 13px var(--body);font-style:normal;color:#111}
.vc-p b{font:800 12px var(--body);max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vc-p u{position:absolute;left:18px;top:-4px;font-size:11px;text-decoration:none}
.vc-p.wait{opacity:.45}
.vc-p.talk{box-shadow:0 0 0 2px var(--c),0 0 12px var(--c)}
#vcf{position:fixed;right:14px;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:50;width:40px;height:40px;border-radius:12px;border:0;background:#22c55e;font-size:19px;display:grid;place-items:center;cursor:pointer}
#vcf.off{background:#ef4444}
.cf{display:flex;flex-direction:column;gap:8px;--ivory:#f3efe6;--ink2:#1c2240;--goldc:#d8b65a}
.cf-pl{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:6px}
.cf-pc{position:relative;display:grid;grid-template-columns:20px 1fr;column-gap:6px;align-items:center;padding:6px 8px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);min-width:0;transition:background .2s,box-shadow .2s}
.cf-pc .cf-shape{grid-row:span 2;width:20px;height:20px}
.cf-pc b{font:800 12px var(--body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cf-pc .cash{font:900 13px var(--body);font-variant-numeric:tabular-nums;color:#e9e4d4}
.cf-pc.on{background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 2px var(--c)}
.cf-pc.out{opacity:.38}
.cf-pc em{position:absolute;right:6px;top:4px;font-style:normal;font-size:11px}
.cf-pc em+em{right:26px}
.cf-bw{width:100%;max-width:640px;margin:0 auto;overflow:auto;border-radius:16px;scrollbar-width:none}
.cf-bw::-webkit-scrollbar{display:none}
.cf-board{position:relative;display:grid;width:100%;aspect-ratio:1;background:#0a0f28;border-radius:14px;padding:3px;gap:1.5px;box-sizing:border-box;box-shadow:0 12px 30px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.06)}
.cf.zoom .cf-board{width:200%}
.cf.zoom .cf-bw{max-height:58vh}
.cf-panel{display:flex;flex-direction:column;align-items:center;gap:5px;width:100%}
.cf-dock{display:none}
.cf.zoom .cf-dock{display:block;background:linear-gradient(180deg,#1b2455,#111838);border-radius:16px;padding:10px;box-shadow:inset 0 0 0 1px rgba(216,182,90,.2)}
.cf.zoom .cf-dock .die{width:34px}
.cf.zoom .cf-cardv{position:fixed;z-index:65}
.cf.zoom .cf-card{max-width:340px}
.cf-t:focus-visible{outline:2px solid var(--goldc);outline-offset:1px;z-index:2}
.cf-t.pulse{animation:cfPulse .8s}
.cf-t.bought{animation:cfBought .9s;z-index:2}
@keyframes cfPulse{0%,100%{box-shadow:none}
40%{box-shadow:inset 0 0 0 3px var(--goldc)}
}
@keyframes cfBought{0%{transform:scale(1)}
35%{transform:scale(1.22);box-shadow:0 0 0 3px var(--oc,#fff),0 6px 16px #0008}
100%{transform:scale(1)}
}
.cf-mid{grid-column:2/11;grid-row:2/11;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:5%;border-radius:8px;overflow:hidden;background:radial-gradient(circle at 50% 38%,#1e2a5e 0%,#111838 62%,#0c1230 100%);box-shadow:inset 0 0 0 1px rgba(216,182,90,.18)}
.cf-mid::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 1px,transparent 1px 22px),repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 22px);pointer-events:none}
.cf-mid>*{position:relative}
.cf-brand{font:900 clamp(11px,4vw,20px) var(--body);letter-spacing:.2em;color:#e8e2d0}
.cf-brand b{color:var(--goldc);font-weight:900}
.cf-round{font:800 clamp(8px,2.6vw,11px) var(--body);color:#9aa0cf;letter-spacing:.08em;text-transform:uppercase;margin-top:-4px}
.has-offer .cf-brand,.has-offer .cf-round,.ph-debt .cf-brand,.ph-debt .cf-round{display:none}
.ph-auction .cf-dice,.ph-trade .cf-dice,.ph-debt .cf-dice,.ph-auction .cf-tip,.ph-trade .cf-tip{display:none}
.cf.zoom .cf-dice{display:flex}
.cf-dice{display:flex;gap:8px}
.cf-dice.dim{opacity:.3}
.die{width:clamp(24px,8.4vw,40px);aspect-ratio:1;background:#fbf8f1;border-radius:22%;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:13%;box-sizing:border-box;box-shadow:0 3px 0 #c9c2b0,0 6px 14px rgba(0,0,0,.4)}
.die b{border-radius:50%}
.die b.on{background:var(--ink2);margin:12%}
.cf-dice.roll .die{animation:cfShake .14s infinite}
.cf-dice.roll .die+.die{animation-delay:.07s}
@keyframes cfShake{0%{transform:rotate(-10deg) translateY(-2px)}
50%{transform:rotate(10deg) translateY(2px)}
100%{transform:rotate(-10deg) translateY(-2px)}
}
.cf-stat{text-align:center;max-width:100%}
.cf-stat p{margin:0}
.cf-stat .l1{font:900 clamp(11px,3.4vw,15px) var(--body)}
.cf-stat .l2{font:700 clamp(9.5px,2.9vw,13px) var(--body);color:#c8cbe8;margin-top:2px}
.cf-acts{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;width:100%}
.cf-b{appearance:none;border:0;border-radius:12px;padding:clamp(6px,2vw,10px) clamp(9px,3vw,14px);font:900 clamp(10.5px,3.2vw,14px) var(--body);color:#fff;background:#2b3470;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.45);letter-spacing:.02em}
.cf-b.pri{background:linear-gradient(180deg,#e2c16a,#b8923a);color:#1d1604}
.cf-b.sec{background:rgba(255,255,255,.1)}
.cf-b:disabled{opacity:.45;cursor:default}
.cf-b:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.45)}
.cf-no,.cf-wait{font:800 clamp(9px,2.8vw,12px) var(--body);color:#c8cbe8;margin:0;width:100%;text-align:center}
.cf-tip{display:flex;gap:4px;align-items:flex-start;font:700 clamp(8.5px,2.6vw,11.5px) var(--body);color:#e9dcb4;max-width:100%;text-align:left}
.cf-tip button{appearance:none;border:0;background:none;color:#9aa0cf;font-size:11px;cursor:pointer;padding:0 2px}
.cf-mc{background:var(--ivory);color:var(--ink2);border-radius:10px;overflow:hidden;display:grid;gap:1px;padding:0 10px 6px;text-align:center;box-shadow:0 6px 16px rgba(0,0,0,.35)}
.cf-mc .band{display:block;height:7px;background:var(--dc);margin:0 -10px 4px}
.cf-mc b{font:900 clamp(11px,3.5vw,15px) var(--body)}
.cf-mc span{font:800 clamp(9px,2.8vw,12px) var(--body);opacity:.75}
.cf-mc small{font:700 clamp(8.5px,2.5vw,11px) var(--body);opacity:.7}
.cf-toks{position:absolute;inset:0;pointer-events:none}
.cf-cardv{position:absolute;inset:0;display:grid;place-items:center;background:rgba(8,11,30,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:4;cursor:pointer}
.cf-cardv[hidden]{display:none}
.cf-card{width:80%;background:#f7f2e7;color:var(--ink2);border-radius:14px;padding:12px 12px 10px;text-align:center;box-shadow:0 14px 30px rgba(0,0,0,.5);animation:cfCard .4s cubic-bezier(.2,.9,.3,1.2);border-top:6px solid #2f7fd1}
.market .cf-card{border-top-color:#b8923a}
.cf-card small{display:block;font:900 clamp(8px,2.5vw,11px) var(--body);letter-spacing:.08em;opacity:.65}
.cf-card b{display:block;font:900 clamp(13px,4.2vw,18px) var(--body);margin:4px 0}
.cf-card p{margin:0;font:700 clamp(10px,3.1vw,13px)/1.3 var(--body)}
.cf-card em{display:block;margin-top:6px;font:800 10px var(--body);opacity:.45;font-style:normal}
@keyframes cfCard{0%{transform:rotateY(80deg) scale(.8);opacity:0}
100%{transform:none;opacity:1}
}
@keyframes cfIn{0%{transform:translateY(6px);opacity:0}
100%{transform:none;opacity:1}
}
.cf-bar{display:flex;gap:4px;background:rgba(255,255,255,.05);padding:4px;border-radius:14px;border:1px solid rgba(255,255,255,.06)}
.cf-bar button{appearance:none;border:0;flex:1;background:none;color:#a3a8d4;font:900 12px var(--body);padding:9px 4px;border-radius:10px;cursor:pointer}
.cf-bar button.on{background:rgba(255,255,255,.12);color:#fff}
.cf-bar .cf-zb{flex:none;width:40px;font-size:15px}
.cf.zoom .cf-zb{background:rgba(216,182,90,.25)}
.cf-tab{min-height:120px}
.cf-net{display:grid;gap:6px}
.cf-nr{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.05);border-radius:12px;padding:8px 10px}
.cf-nr.out{opacity:.4}
.cf-nr .rk{font:900 13px var(--body);color:#9aa0cf;width:14px}
.cf-nr .cf-shape{width:18px;height:18px;flex:none}
.cf-nr .nm{flex:1;min-width:0;display:grid;gap:2px}
.cf-nr .nm b{font:900 13px var(--body)}
.cf-nr .nm small{font:700 10.5px var(--body);color:#a3a8d4}
.cf-nr .bar{display:block;height:4px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden}
.cf-nr .bar i{display:block;height:100%;border-radius:3px;transition:width .5s}
.cf-nr .v{font:900 14px var(--body);font-variant-numeric:tabular-nums;color:var(--goldc)}
.cf-foot{font:700 11px var(--body);color:#8a90c0;margin:8px 2px 0}
.cf-who{display:flex;align-items:center;gap:6px;font:800 13px var(--body);margin:0 0 6px}
.cf-who .cf-shape{width:16px;height:16px}
.cf-grp{margin-bottom:8px}
.cf-grp>p{display:flex;align-items:center;gap:6px;margin:0 0 4px;font:900 12px var(--body)}
.cf-grp>p i{width:10px;height:10px;border-radius:3px;background:var(--dc)}
.cf-grp small{color:#a3a8d4;font-weight:800}
.cf-row{appearance:none;border:0;width:100%;display:flex;justify-content:space-between;gap:8px;background:rgba(255,255,255,.05);color:#fff;border-radius:10px;padding:9px 10px;margin-bottom:4px;font:800 13px var(--body);cursor:pointer;text-align:left;border-left:4px solid var(--dc,#8a93c9)}
.cf-row small{color:#c8cbe8;font-weight:800}
.cf-kc{background:rgba(216,182,90,.12);border:1px solid rgba(216,182,90,.3);border-radius:10px;padding:8px 10px;margin-bottom:4px;display:grid}
.cf-kc b{font:900 13px var(--body);color:#ecd9a0}
.cf-kc small{font:700 11px var(--body);color:#c8cbe8}
.cf-empty{font:700 13px var(--body);color:#a3a8d4;text-align:center;padding:14px}
.cf-log{display:grid;gap:4px;max-height:320px;overflow:auto}
.cf-log p{margin:0;font:700 12.5px/1.35 var(--body);padding:6px 10px;background:rgba(255,255,255,.04);border-radius:8px;border-left:3px solid var(--c)}
.cf-sheet{position:fixed;inset:0;z-index:60}
.cf-sheet[hidden]{display:none}
.cf-sh-bg{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.cf-sh{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:#151b3d;border-radius:20px 20px 0 0;padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 18px);max-height:78vh;overflow:auto;animation:cfUp .22s ease-out;box-shadow:0 -10px 30px rgba(0,0,0,.4)}
@keyframes cfUp{0%{transform:translateY(40px);opacity:0}
100%{transform:none;opacity:1}
}
.cf-sh-top{display:flex;gap:10px;align-items:center;border-left:6px solid var(--dc);padding-left:10px;margin-bottom:10px}
.cf-sh-top>span{font-size:24px}
.cf-sh-top div{flex:1}
.cf-sh-top small{font:800 11px var(--body);color:#a3a8d4;text-transform:uppercase;letter-spacing:.06em}
.cf-sh-top h3{font:900 20px var(--body)}
.cf-x{appearance:none;border:0;background:rgba(255,255,255,.08);color:#fff;width:34px;height:34px;border-radius:10px;font-size:14px;cursor:pointer}
.cf-sub{font:900 12px var(--body);margin:0 0 8px}
.cf-owner{display:flex;align-items:center;gap:6px;font:800 13px var(--body);margin:0 0 10px;color:#e9e4d4}
.cf-owner .cf-shape{width:16px;height:16px}
.cf-rt{width:100%;border-collapse:collapse;font:700 13px var(--body)}
.cf-rt td{padding:6px 2px;border-bottom:1px solid rgba(255,255,255,.07)}
.cf-rt td:last-child{text-align:right;font-weight:900;font-variant-numeric:tabular-nums}
.cf-rt tr.cur td{color:var(--goldc)}
.cf-rt tr.sep td{color:#a3a8d4}
.cf-note,.cf-desc{font:700 12.5px/1.4 var(--body);color:#c8cbe8}
.cf-desc{font-size:14px;color:#e9e4d4}
.cf-float{position:fixed;z-index:70;transform:translateX(-50%);font:900 14px var(--body);pointer-events:none;animation:cfFloat 1.2s forwards;text-shadow:0 2px 4px rgba(0,0,0,.7)}
.cf-float.up{color:#3ddc84}
.cf-float.down{color:#ff7b7b}
@keyframes cfFloat{0%{opacity:0;transform:translate(-50%,6px)}
15%{opacity:1}
100%{opacity:0;transform:translate(-50%,-34px)}
}
.cf-pc.ap{box-shadow:inset 0 0 0 2px var(--c),0 0 0 2px rgba(216,182,90,.6)}
.cf-b.tool{background:rgba(216,182,90,.16);color:#f0dfae;box-shadow:inset 0 0 0 1px rgba(216,182,90,.35)}
.cf-bidders{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:5px}
.cf-bidders span{font:800 clamp(8.5px,2.5vw,11px) var(--body);padding:2px 7px;border-radius:10px;background:rgba(255,255,255,.08);border:1px solid transparent}
.cf-bidders .on{border-color:var(--c)}
.cf-bidders .lead{background:rgba(216,182,90,.25);color:#f0dfae}
.cf-tc{display:flex;align-items:center;gap:6px;background:var(--ivory);color:var(--ink2);border-radius:10px;padding:6px 8px;max-width:100%;box-shadow:0 6px 16px rgba(0,0,0,.35)}
.cf-tc>span{font-size:16px;opacity:.5}
.cf-tc>div{flex:1;min-width:0}
.cf-tc small{display:block;font:900 clamp(8px,2.4vw,10px) var(--body);opacity:.6;text-transform:uppercase}
.cf-tc p{margin:2px 0 0;display:flex;flex-wrap:wrap;gap:3px;font:800 clamp(9px,2.7vw,12px) var(--body)}
.cf-tc i{font-style:normal;border-left:4px solid var(--dc);padding-left:3px}
.cf-mini{appearance:none;border:0;margin-left:auto;background:rgba(216,182,90,.18);color:#f0dfae;font:900 12px var(--body);padding:6px 10px;border-radius:10px;cursor:pointer}
.cf-gh{display:flex;align-items:center;gap:6px;margin:12px 0 6px;font:900 13px var(--body)}
.cf-gh i{width:10px;height:10px;border-radius:3px;background:var(--dc)}
.cf-gh small{color:#a3a8d4;font-weight:800}
.cf-mr{background:rgba(255,255,255,.05);border-left:4px solid var(--dc);border-radius:10px;padding:8px 10px;margin-bottom:6px}
.cf-mr .h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cf-mr .h b{font:900 14px var(--body)}
.cf-mr .h small{color:#c8cbe8;font:800 12px var(--body)}
.lvbar{display:flex;gap:2px;margin-left:auto}
.lvbar u{width:9px;height:9px;border-radius:2px;background:rgba(255,255,255,.12)}
.lvbar u.on{background:var(--goldc)}
.cf-sh{text-align:left}
.cf-mr .cf-mbt{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;justify-content:flex-start;align-items:center}
.cf-mr .cf-mbt .cf-mb{flex:0 0 auto;width:auto}
.cf-mb{appearance:none;border:0;border-radius:10px;padding:8px 10px;font:900 12.5px var(--body);color:#fff;background:#2b3470;cursor:pointer}
.cf-mb.pri{background:linear-gradient(180deg,#e2c16a,#b8923a);color:#1d1604}
.cf-mb:disabled{opacity:.38;cursor:default}
.cf-mr .why{margin:5px 0 0;font:700 11px var(--body);color:#a3a8d4}
.cf-debt{background:rgba(255,90,95,.12);border:1px solid rgba(255,90,95,.35);border-radius:12px;padding:10px 12px;font:800 13.5px var(--body);margin:0 0 8px}
.cf-with{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.cf-with button{appearance:none;border:0;display:flex;align-items:center;gap:5px;padding:7px 10px;border-radius:12px;background:rgba(255,255,255,.06);color:#fff;font:800 13px var(--body);cursor:pointer}
.cf-with button.on{box-shadow:inset 0 0 0 2px var(--c);background:rgba(255,255,255,.12)}
.cf-with .cf-shape{width:16px;height:16px}
.cf-tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cf-tcol{background:rgba(255,255,255,.04);border-radius:12px;padding:8px;min-width:0}
.cf-tcol .cf-gh{margin:0 0 6px}
.cf-tcol .cf-gh i{border-radius:50%}
.cf-cash{display:flex;align-items:center;gap:3px}
.cf-cash b{flex:1;text-align:center;font:900 14px var(--body);color:var(--goldc)}
.cf-cash button{appearance:none;border:0;background:rgba(255,255,255,.1);color:#fff;border-radius:8px;padding:6px 5px;font:900 11px var(--body);cursor:pointer}
.cf-tcol>small{display:block;font:700 10.5px var(--body);margin:3px 0 6px}
.cf-tp{display:grid;gap:4px}
.cf-tp button{appearance:none;border:0;text-align:left;background:rgba(255,255,255,.06);color:#fff;border-left:4px solid var(--dc,#d8b65a);border-radius:8px;padding:7px 8px;font:800 12px var(--body);cursor:pointer}
.cf-tp button.on{background:rgba(216,182,90,.28);box-shadow:inset 0 0 0 1px var(--goldc)}
.cf-tp button:disabled{opacity:.4}
.cf-pc.away{opacity:.6}
.cf-pc.away b{text-decoration:line-through dotted}
.cf-emo{display:flex;justify-content:space-between;gap:4px;background:rgba(255,255,255,.04);border-radius:14px;padding:4px}
.cf-emo button{appearance:none;border:0;background:none;font-size:22px;flex:1;padding:4px 0;border-radius:10px;cursor:pointer}
.cf-emo button:active{background:rgba(255,255,255,.1);transform:scale(.9)}
.cf-emof{position:fixed;z-index:72;transform:translateX(-50%);font-size:30px;pointer-events:none;animation:cfEmo 1.8s ease-out forwards}
@keyframes cfEmo{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}
15%{opacity:1;transform:translate(-50%,0) scale(1.15)}
100%{opacity:0;transform:translate(-50%,-70px) scale(1)}
}
.cf-clock{margin:3px 0 0!important;font:900 clamp(10px,3vw,13px) var(--body);color:#f0dfae}
.cf-clock.low{color:#ff7b7b}
.cf-resume{display:grid;grid-template-columns:1fr auto;gap:8px 10px;align-items:center;background:linear-gradient(135deg,rgba(216,182,90,.18),rgba(27,38,88,.6));border:1px solid rgba(216,182,90,.45);border-radius:18px;padding:12px 14px}
.cf-resume.alt{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.12)}
.cf-resume b{display:block;font:900 15px var(--body)}
.cf-resume small{display:block;font:700 12px var(--body);color:#c8cbe8;margin-top:2px}
.cf-resume .btn{font-size:16px;padding:11px 14px}

.rz{display:flex;flex-direction:column;align-items:center;gap:8px;min-height:calc(100dvh - 120px);padding-top:6px;text-align:center}
.rz-hero{position:relative;width:190px;height:190px;display:grid;place-items:center}
.rz-rays{position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--c) 38%,transparent) 0 10deg,transparent 10deg 24deg);-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%);animation:rzSpin 14s linear infinite}
.rz-hero::before{content:"";position:absolute;inset:30px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 55%,transparent),transparent 70%);filter:blur(8px)}
.rz-ico{position:relative;width:128px;height:128px;animation:rzPop .7s cubic-bezier(.2,1.5,.4,1) both,rzFloat 3s ease-in-out .7s infinite}
.rz-ico svg{width:100%;height:100%;filter:drop-shadow(0 10px 18px rgba(0,0,0,.45))}
.rz.lost .rz-rays{opacity:.25;animation-duration:30s}
.rz.lost .rz-ico{animation:rzPop .7s cubic-bezier(.2,1.5,.4,1) both,rzShake 2.6s ease-in-out 1s infinite}
.rz-game{margin:0;display:flex;align-items:center;gap:8px;font:600 12px var(--u-f);letter-spacing:.14em;text-transform:uppercase;color:#9aa0ad}
.rz-art{width:28px;height:28px;border-radius:8px;overflow:hidden;display:inline-block}
.rz-art svg{width:100%;height:100%}
.rz-title{margin:0;font:800 40px/1.05 var(--u-f);color:var(--c);text-shadow:0 0 28px color-mix(in srgb,var(--c) 55%,transparent);animation:rzUp .5s .15s both}
.rz.lost .rz-title{color:#e6e8ee;text-shadow:none}
.rz-sub{margin:0;font:500 15px var(--u-f);color:#c9cdd6;animation:rzUp .5s .25s both}
.rz-score{display:flex;align-items:center;gap:16px;font:800 56px var(--u-f);animation:rzUp .5s .3s both}
.rz-score i{font-style:normal;color:#5b6070;font-size:30px}
.rz-list{width:100%;max-width:420px;display:grid;gap:8px;margin-top:6px;animation:rzUp .5s .35s both}
.rz-row{display:grid;grid-template-columns:22px 12px 1fr auto;gap:10px;align-items:center;background:#15171c;border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:12px 14px;text-align:left}
.rz-row i{width:12px;height:12px;border-radius:50%;background:var(--k);box-shadow:0 0 10px var(--k)}
.rz-row b{font:600 15px var(--u-f);color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rz-n{font:700 13px var(--u-f);color:#8b91a1}
.rz-v{font:700 14px var(--u-f);color:#c9cdd6}
.rz-row.best{border-color:color-mix(in srgb,var(--k) 60%,transparent);background:linear-gradient(90deg,color-mix(in srgb,var(--k) 18%,#15171c),#15171c)}
.rz-note{margin:2px 0 0;font:400 12px var(--u-f);color:#8b91a1}
.rz-btns{width:100%;max-width:420px;display:grid;gap:8px;margin-top:10px}
.rz-btns .btn{display:flex;align-items:center;justify-content:center;gap:8px}
.rz-btns .btn svg{width:18px;height:18px}
@keyframes rzSpin{to{transform:rotate(360deg)}
}
@keyframes rzPop{0%{transform:scale(0) rotate(-20deg)}
100%{transform:none}
}
@keyframes rzFloat{50%{transform:translateY(-6px)}
}
@keyframes rzShake{0%,100%{transform:none}
10%{transform:rotate(-6deg)}
20%{transform:rotate(6deg)}
30%{transform:none}
}
@keyframes rzUp{from{opacity:0;transform:translateY(12px)}
to{opacity:1;transform:none}
}
.tg-ban{background:linear-gradient(160deg,rgba(28,31,40,.96),rgba(12,13,18,.96));border:1px solid rgba(255,255,255,.14);box-shadow:0 24px 60px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.04) inset;backdrop-filter:blur(8px)}
.tg-ban b{font:800 32px/1.1 var(--u-f)!important;text-shadow:0 0 24px currentColor}
.tg-ban.big b{font-size:38px!important}
.tg-ban span{font:500 14px var(--u-f)!important;color:#aab0bd!important}
.tk{position:relative;gap:12px}
.tk::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(40% 30% at 15% 20%,rgba(255,77,109,.18),transparent 70%),radial-gradient(40% 30% at 85% 75%,rgba(39,199,255,.18),transparent 70%),radial-gradient(60% 50% at 50% 50%,rgba(125,107,255,.12),transparent 70%);animation:tkBg 9s ease-in-out infinite alternate}
@keyframes tkBg{to{transform:translate3d(0,-3%,0) scale(1.06)}
}
.tk-p{background:rgba(20,22,32,.8);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:8px 12px;gap:10px;transition:box-shadow .25s,border-color .25s,transform .25s}
.tk-p.on{border-color:var(--c);background:rgba(20,22,32,.9);box-shadow:0 0 0 1px var(--c),0 0 22px -4px var(--c);transform:translateY(-2px)}
.tk-p.won{box-shadow:0 0 0 2px #ffd23f,0 0 26px -2px #ffd23f}
.tk-pm{width:34px;height:34px;flex:none}
.tk-pm .mk{width:100%;height:100%}
.tk-pn{display:flex;flex-direction:column;min-width:0}
.tk-pn b{font:700 15px var(--u-f);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk-pn small{font:500 11.5px var(--u-f);color:#9aa0ad;margin:0}
.tk-turn{font:700 22px var(--u-f);color:#c9cdd6;margin:2px 0}
.tk-turn.me{color:var(--c);text-shadow:0 0 18px var(--c);animation:tkPulse 1.6s ease-in-out infinite}
@keyframes tkPulse{50%{opacity:.7}
}
.tk-board{position:relative;width:min(92vw,400px);aspect-ratio:1;border-radius:26px;background:radial-gradient(120% 120% at 50% 0%,#1d1740,#0c0b1a 70%);box-shadow:0 0 0 1px rgba(125,107,255,.35),0 20px 50px rgba(0,0,0,.55),inset 0 0 60px rgba(125,107,255,.12);padding:10px}
.tk-lines{position:absolute;inset:10px;width:calc(100% - 20px);height:calc(100% - 20px);filter:drop-shadow(0 0 4px #7d6bff) drop-shadow(0 0 10px #5b45ff);pointer-events:none}
.tk-grid{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:0;width:100%;height:100%;aspect-ratio:auto}
.tk-c{appearance:none;border:0;background:none;box-shadow:none;border-radius:18px;padding:16%;display:grid;place-items:center;cursor:pointer;transition:background .15s}
.tk-c.free:hover,.tk-c.free:focus-visible{background:rgba(255,255,255,.04)}
.tk-c.free:active{background:rgba(255,255,255,.08);transform:scale(.95)}
.tk-c.win{background:none;box-shadow:none}
.tk-c.win .mk{animation:tkWin .7s ease-in-out infinite alternate}
.tk .mk{width:100%;height:100%;overflow:visible}
.tk .mk.x{filter:drop-shadow(0 0 5px #ff4d6d) drop-shadow(0 0 14px rgba(255,77,109,.7))}
.tk .mk.o{filter:drop-shadow(0 0 5px #27c7ff) drop-shadow(0 0 14px rgba(39,199,255,.7))}
.tk .mk.ghost{opacity:0;transition:opacity .15s;filter:none}
.tk-c.free:hover .mk.ghost{opacity:.18}
.tk .mk.draw path,.tk .mk.draw circle{stroke-dasharray:100;stroke-dashoffset:100;animation:tkDraw .35s ease-out forwards}
.tk .mk.draw path+path,.tk .mk.draw circle+circle{animation-delay:.08s}
@keyframes tkDraw{to{stroke-dashoffset:0}
}
@keyframes tkWin{to{transform:scale(1.1)}
}
.tk-win{position:absolute;inset:10px;width:calc(100% - 20px);height:calc(100% - 20px);pointer-events:none;filter:drop-shadow(0 0 6px #fff) drop-shadow(0 0 16px #ffd23f)}
.tk-win line{stroke-dasharray:100;stroke-dashoffset:100;animation:tkDraw .5s .15s ease-out forwards}
.tk-board.done .tk-c:not(.win) .mk{opacity:.35;transition:opacity .4s}
.ch-frame{width:min(96vw,62vh,520px);margin:0 auto;padding:10px;border-radius:16px;background:linear-gradient(135deg,#6b3f22,#3b2112 45%,#5a3219);box-shadow:0 18px 40px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.18),inset 0 -2px 0 rgba(0,0,0,.35)}
.ch-frame .ch-board{width:100%;border-radius:6px;box-shadow:0 0 0 2px #2a170b,inset 0 0 0 1px rgba(0,0,0,.3)}
.ch .sq.l{background:linear-gradient(135deg,#f0dcb4,#e3c79a)}
.ch .sq.d{background:linear-gradient(135deg,#b07a4a,#8e5a31)}
.ch .sq.l::after,.ch .sq.d::after{mix-blend-mode:multiply}
.ch .sq .fl,.ch .sq .rk{font:700 9px var(--u-f);color:rgba(60,32,12,.6)}
.ch .sq.d .fl,.ch .sq.d .rk{color:rgba(255,236,200,.7)}
.ch .sq.last::before{background:rgba(255,196,64,.42)}
.ch .sq.sel::before{background:rgba(92,214,120,.5);box-shadow:inset 0 0 0 3px rgba(40,160,70,.8)}
.ch .sq.dst::after{background:rgba(35,20,8,.32);width:30%;height:30%}
.ch .sq.cap::after{border-color:rgba(35,20,8,.45)}
.ch .pc{width:88%;height:88%;position:relative;z-index:1;filter:drop-shadow(0 3px 2px rgba(0,0,0,.45));transition:transform .12s}
.ch .sq.sel .pc{transform:translateY(-3px) scale(1.06);filter:drop-shadow(0 8px 6px rgba(0,0,0,.45))}
.ch-row{background:rgba(20,22,32,.85);border:1px solid rgba(255,255,255,.07);border-left:4px solid var(--c);border-radius:14px}
.ch-dot{border:0!important;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.ch-cap .pc.mini{width:20px;height:20px;filter:none}
.ch-turn{background:linear-gradient(180deg,#ffd76a,#e5a91d);box-shadow:0 0 12px rgba(255,200,60,.5)}
.ch-status{font:700 19px var(--u-f)}
.ch-promo button{background:linear-gradient(135deg,#f0dcb4,#e3c79a)}
.hg-scene{position:relative;border-radius:22px;overflow:hidden;box-shadow:0 14px 34px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.08)}
.hg-scene .hg{display:block;width:100%;height:auto;max-height:34vh;aspect-ratio:240/200}
.hg .hp{animation:hgIn .45s cubic-bezier(.2,1.6,.4,1) both;transform-box:fill-box;transform-origin:center}
@keyframes hgIn{from{opacity:0;transform:scale(.4)}
}
.hg.lost .hg-man{transform-origin:150px 38px;animation:hgSwing 2.4s ease-in-out infinite}
@keyframes hgSwing{0%,100%{transform:rotate(3deg)}
50%{transform:rotate(-3deg)}
}
.hg.won .hg-free{animation:hgJump .7s ease-in-out infinite alternate}
@keyframes hgJump{from{transform:translateY(22px)}
to{transform:translateY(8px)}
}
.hg-stars path{animation:hgTw 1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes hgTw{to{transform:scale(1.3) rotate(20deg)}
}
.hg-hud{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap}
.hg-chip{background:rgba(10,12,24,.62);backdrop-filter:blur(6px);color:#fff;border-radius:999px;padding:5px 11px;font:600 12px var(--u-f)}
.hg-chip.cat{background:rgba(255,210,63,.9);color:#2a1d00}
.hg-life{position:absolute;right:10px;bottom:10px;background:rgba(10,12,24,.62);backdrop-filter:blur(6px);border-radius:12px;padding:6px 9px;display:grid;gap:4px}
.hg-life span{font:600 10px var(--u-f);color:#c9cdd6;text-transform:uppercase;letter-spacing:.08em}
.hg-life div{display:flex;gap:3px}
.hg-life i{width:12px;height:12px;border-radius:4px;background:rgba(255,255,255,.18)}
.hg-life i.on{background:linear-gradient(180deg,#ff7a8c,#e8385a);box-shadow:0 0 6px rgba(255,80,110,.6)}
.hg-word{gap:7px;padding:10px 0 2px}
.hg-l{width:34px;height:44px;border:0;border-radius:10px;background:linear-gradient(180deg,#232738,#181b28);box-shadow:inset 0 -3px 0 rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.08);perspective:200px;display:grid;place-items:center;font:800 24px var(--u-f);color:#fff}
.hg-l b{display:block}
.hg-l.on{background:linear-gradient(180deg,#fdfcff,#e3e6f4);color:#1d2140;box-shadow:inset 0 -3px 0 #b9bfd8,0 4px 10px rgba(0,0,0,.3)}
.hg-l.new{animation:hgFlip .5s ease-out}
@keyframes hgFlip{from{transform:rotateY(90deg)}
to{transform:none}
}
.hg-l.miss{background:linear-gradient(180deg,#5a1f2c,#3d1420);color:#ff9aa9}
.hg-msg{font:700 20px var(--u-f)}
.hg-sub{font:500 13px var(--u-f)}
.hgw .kb{gap:6px}
.hgw .k{border-radius:12px;background:linear-gradient(180deg,#2a2f44,#1f2335);box-shadow:inset 0 -3px 0 rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.07);color:#fff;font:700 17px var(--u-f)}
.hgw .k:not([disabled]):active{transform:translateY(2px);box-shadow:inset 0 -1px 0 rgba(0,0,0,.4)}
.hgw .k.y{background:linear-gradient(180deg,#2fd07b,#1e9e5a);color:#fff;box-shadow:inset 0 -3px 0 #137a43}
.hgw .k.n{background:#1a1c26;color:#5b6070;box-shadow:none;text-decoration:line-through}
.pass{gap:14px}
.pass-dot{width:96px;height:96px;box-shadow:0 0 0 10px color-mix(in srgb,currentColor 0%,rgba(255,255,255,.06)),0 0 40px rgba(255,255,255,.12);position:relative;animation:passBeat 1.6s ease-in-out infinite}
.pass-dot::after{content:"📱";position:absolute;inset:0;display:grid;place-items:center;font-size:40px}
@keyframes passBeat{50%{transform:scale(1.06)}
}
.pass h2{font:800 30px/1.15 var(--u-f)}
.pass p{font:500 15px/1.45 var(--u-f);color:#c9cdd6;max-width:320px}
.stp .st-l{background:conic-gradient(from 0deg,#ff5a5f,#ffb020,#2ec4b6,#3da9fc,#9b5cff,#ff5a5f);box-shadow:0 0 0 6px rgba(255,255,255,.08),0 14px 34px rgba(0,0,0,.45);color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.25);font:800 76px var(--u-f)}
.stp .st-l.spin{animation:stSpin .7s linear infinite}
@keyframes stSpin{to{filter:hue-rotate(360deg)}
}
.stp .st-roll:not(.small) .st-l{width:136px;height:136px;border-radius:34px}
.stp .st-roll.small .st-l{font-size:40px}
.stp.w .st-form,.stp .st-tbl{position:relative;background:#fdfbf3;border-radius:16px;box-shadow:0 12px 30px rgba(0,0,0,.4);overflow:hidden}
.stp.w .st-form{gap:0;padding:14px 12px 10px 44px;background:repeating-linear-gradient(#fdfbf3 0 43px,#c9dcf2 43px 45px),#fdfbf3}
.stp.w .st-form::before{content:"";position:absolute;left:30px;top:0;bottom:0;width:2px;background:#ef8b8b}
.stp.w .st-form::after{content:"";position:absolute;left:8px;top:18px;bottom:18px;width:12px;background:radial-gradient(circle,#1b1d2a 4px,transparent 5px) 0 0/12px 45px repeat-y;opacity:.85}
.stp .st-f{background:transparent;border:0;border-radius:0;padding:0 4px;height:45px;grid-template-columns:92px 1fr 22px}
.stp .st-f span{font:700 12px var(--u-f);color:#6c7089;text-transform:uppercase;letter-spacing:.04em}
.stp .st-f input{font:700 25px 'Caveat',var(--u-f);color:#1f3fb8;padding:0;height:45px}
.stp .st-f input::placeholder{color:#b9bccb;font:500 14px var(--u-f)}
.stp .st-f.ok{border:0}
.stp .st-f.bad{border:0;background:rgba(255,77,109,.08)}
.stp .st-f.ok i::after{color:#1e9e5a}
.stp .st-f.bad i::after{color:#e8385a}
.stp .st-bar{height:12px;border-radius:6px;background:rgba(255,255,255,.1)}
.stp .st-bar i{background:linear-gradient(90deg,#ff4d6d,#ffb020,#2fd07b);box-shadow:0 0 10px rgba(255,176,32,.6)}
.stp .st-stop{background:linear-gradient(180deg,#ff3b55,#c81e3a);box-shadow:0 0 0 4px rgba(255,59,85,.25),0 10px 24px rgba(200,30,58,.45);font:800 20px var(--u-f);transform:rotate(-1.5deg)}
.stp .st-tbl table{color:#1d2140}
.stp .st-tbl th{color:inherit;border-bottom:2px solid #c9dcf2;background:#f3efe2}
.stp .st-tbl td{border-bottom:1px solid #d9e6f5}
.stp .st-tbl td.cat{color:#6c7089}
.stp .st-tbl td span{font:700 18px 'Caveat',var(--u-f);color:#1f3fb8}
.stp .st-tbl td b{font:800 12px var(--u-f);border-radius:999px;padding:2px 7px;color:#fff}
.stp .st-tbl td.r b{color:#231a00}
.stp .st-tbl tr.tot td{font:800 16px var(--u-f);color:#1d2140;background:#f3efe2}
.stp .btn.green{font:700 17px var(--u-f)}
.ui-bot{position:absolute;left:6px;bottom:6px;z-index:2;font-style:normal;font-size:12px;line-height:1;background:rgba(10,12,24,.72);backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:3px 5px}
.ui-row .th{position:relative}
.ui-row .ui-bot{left:auto;right:-4px;bottom:-4px;font-size:10px;padding:2px 3px}
.hx-tile .th::after,.ui-row .th::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,0) 40%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);pointer-events:none}
@media (hover:hover){.hx-tile:hover .th{transform:translateY(-4px);box-shadow:0 20px 30px -14px rgba(0,0,0,.95),0 0 0 2px rgba(255,255,255,.12)}
}
.hx-hero .art svg{filter:drop-shadow(0 16px 22px rgba(0,0,0,.5))}
.qv-coins{margin-left:auto;background:linear-gradient(180deg,#ffd76a,#e5a91d);color:#2a1d00;border-radius:999px;padding:6px 12px;font:700 14px var(--u-f);box-shadow:0 0 14px rgba(255,200,60,.35)}
.qv-hero{position:relative;border-radius:24px;padding:18px 16px 16px;overflow:hidden;background:linear-gradient(180deg,#ffcc00 0 33%,#0b3d91 33% 67%,#cf142b 67%);box-shadow:0 18px 40px rgba(0,0,0,.45);text-align:center}
.qv-hero::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,rgba(0,0,0,0),rgba(0,0,0,.5))}
.qv-hero>*{position:relative}
.qv-logo{display:inline-grid;background:#fff;color:#1b2350;border-radius:18px;padding:6px 18px 10px;transform:rotate(-3deg);box-shadow:0 8px 0 #1b2350}
.qv-logo span{font:700 16px var(--u-f)}
.qv-logo b{font:900 34px/1 var(--u-f);letter-spacing:-.02em}
.qv-hero>p{margin:14px 0 10px;font:600 14px var(--u-f);color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.5)}
.qv-prog{background:rgba(10,12,24,.55);backdrop-filter:blur(6px);border-radius:14px;padding:10px 12px;display:grid;gap:6px;text-align:left}
.qv-prog div{height:10px;border-radius:5px;background:rgba(255,255,255,.15);overflow:hidden}
.qv-prog i{display:block;height:100%;background:linear-gradient(90deg,#ffcc00,#2fd07b);border-radius:5px}
.qv-prog span{font:500 12.5px var(--u-f);color:#dfe3ee}
.qv-prog b{color:#fff}
.qv-go{margin-top:12px;display:flex;align-items:center;justify-content:center;gap:8px}
.qv-go svg{width:18px;height:18px}
.qv-quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.qv-quick button{appearance:none;border:1px solid rgba(255,255,255,.08);background:#15171c;color:#fff;border-radius:16px;padding:10px 4px;display:grid;justify-items:center;gap:2px;cursor:pointer;position:relative}
.qv-quick span{font-size:24px}
.qv-quick b{font:600 12px var(--u-f)}
.qv-quick small{font:400 10px var(--u-f);color:#9aa0ad}
.qv-quick .hot{border-color:rgba(255,204,0,.6);box-shadow:0 0 16px -4px #ffcc00}
.qv-quick .hot::after{content:"";position:absolute;top:8px;right:10px;width:9px;height:9px;border-radius:50%;background:#ff4d6d;box-shadow:0 0 8px #ff4d6d}
.qv-cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qv-cat{appearance:none;border:0;cursor:pointer;position:relative;overflow:hidden;text-align:left;color:#fff;border-radius:18px;padding:12px 12px 16px;background:linear-gradient(145deg,var(--c1),var(--c2));display:grid;gap:2px;box-shadow:0 10px 20px -10px rgba(0,0,0,.8)}
.qv-cat .ic{font-size:28px}
.qv-cat b{font:700 15px var(--u-f)}
.qv-cat small{font:500 12px var(--u-f);opacity:.85}
.qv-cat i{position:absolute;left:0;bottom:0;height:5px;background:rgba(255,255,255,.85)}
.qv-cat.lock{filter:grayscale(.85) brightness(.6)}
.qv-cat.full{box-shadow:0 0 0 2px #ffd23f,0 10px 20px -10px rgba(0,0,0,.8)}
.qv-grp{margin-top:12px}
.qv-play,.qvg{display:flex;flex-direction:column;gap:12px}
.qv-lv{display:flex;justify-content:space-between;align-items:center;font:600 13px var(--u-f);color:#c9cdd6}

gente:[["PANA","🤝","Amigo de confianza.","Ese es mi pana desde el colegio."],["CHAMO","🧢","Muchacho, joven. También se usa para llamar a alguien.","Chamo, pásame la sal."],["CHAMA","👧","Muchacha, joven.","La chama de la esquina canta demasiado bien."],["CATIRE","👱","Persona rubia.","El catire es el más alto del equipo."],["JEVA","💑","Novia o muchacha con la que se sale.","Fue al cine con su jeva."],["SIFRINO","💅","Persona que se cree de clase alta y es presumida.","Se puso sifrino y ya no come en la calle."],["SAPO","🐸","Chismoso, el que acusa o delata.","No seas sapo, no le digas a la profe."],["CUAIMA","🐍","Mujer muy celosa y mandona con su pareja.","No puede salir, la cuaima no lo deja."],["PAVOSO","🐈‍⬛","Que trae mala suerte.","No digas eso, no seas pavoso."],["PICHIRRE","🪙","Tacaño, que no quiere gastar ni compartir.","Es tan pichirre que no brinda ni un chicle."],["GOCHO","⛰️","Persona de los Andes venezolanos.","Los gochos hablan bien rapidito y de usted."],["MARACUCHO","🌞","Persona del Zulia, famosa por su forma de hablar.","El maracucho nos invitó a una gaita."],["LLANERO","🤠","Persona de los llanos, de a caballo y joropo.","El llanero se levantó a las cuatro a ordeñar."],["MUSIÚ","🧳","Extranjero, sobre todo de otro continente.","El musiú se enamoró de la arepa."],["ECHÓN","😎","Presumido, que se cree mucho.","Desde que tiene carro está echón."],["LAMBUCIO","🤤","Glotón, que come de todo y mucho.","Ese lambucio se comió todos los tequeños."],["MALANDRO","🦹","Delincuente o persona de mala conducta.","Mosca con los malandros de esa esquina."],["JALA MECATE","🪢","Adulador, el que le hace la pelota al jefe.","El jala mecate siempre le lleva café al jefe."],["BOCHINCHERO","📣","El que arma desorden y bulla.","El bochinchero del salón siempre termina castigado."],["CAÍDO DE LA MATA","🍃","Persona ingenua, que se cree todo.","No seas caído de la mata, eso es una estafa."],["MI VIEJA","👵","Forma cariñosa de llamar a la mamá.","Voy a llamar a mi vieja para saludarla."],["MARGARITEÑO","🏖️","Persona de la isla de Margarita.","El margariteño nos llevó a comer pescado frito."]],
comida:[["AREPA","🫓","Pan redondo de maíz que se rellena con de todo.","Me comí una arepa de reina pepiada."],["CACHAPA","🌽","Tortilla dulce de maíz tierno, con queso de mano.","Paramos en la carretera a comer cachapa."],["TEQUEÑO","🧀","Palito de queso envuelto en masa y frito.","En toda fiesta que se respete hay tequeños."],["HALLACA","🎄","Pastel navideño de masa de maíz con guiso, envuelto en hoja de plátano.","En diciembre toda la familia hace hallacas."],["CAMBUR","🍌","Banana.","Llévate un cambur para la merienda."],["CARAOTAS","🫘","Frijoles negros.","Las caraotas con azúcar son un vicio."],["TAJADAS","🍠","Plátano maduro frito en rebanadas.","El pabellón no está completo sin tajadas."],["PABELLÓN","🍛","Plato con carne mechada, caraotas, arroz y tajadas.","Los domingos mi abuela hace pabellón."],["COTUFAS","🍿","Palomitas de maíz.","Compramos cotufas para ver la película."],["GUAYOYO","☕","Café negro, suave y colado.","Un guayoyo bien caliente para empezar el día."],["MARRÓN","🤎","Café con un poquito de leche.","Deme un marrón pequeño, por favor."],["MALTA","🍺","Bebida de cebada sin alcohol, oscura y dulce.","Arepa con malta, la merienda perfecta."],["EMPANADA","🥟","Masa de maíz rellena y frita.","Desayuné dos empanadas de queso."],["PAN DE JAMÓN","🍞","Pan navideño relleno de jamón, pasas y aceitunas.","Llegó diciembre y con él el pan de jamón."],["PAPELÓN CON LIMÓN","🍋","Bebida fría de papelón (panela) con limón.","Con este calor provoca un papelón con limón."],["QUESO DE MANO","🧀","Queso blando y fresco hecho a mano.","La cachapa con queso de mano es otro nivel."],["CACHITO","🥐","Pan en forma de cuerno relleno de jamón.","Pasé por la panadería y compré cachitos."],["CATALINA","🍪","Galleta dulce y oscura hecha con papelón.","Mi abuelo desayuna catalina con leche."],["CHICHA","🥛","Bebida espesa y dulce de arroz con leche.","El chichero pasa todos los días por la plaza."],["PARCHITA","💛","Maracuyá.","El jugo de parchita me encanta."],["LECHOSA","🧡","Papaya.","De postre hay dulce de lechosa."],["AUYAMA","🎃","Calabaza.","La crema de auyama quedó buenísima."],["GOLFEADO","🌀","Pan dulce en espiral con papelón, anís y queso.","Un golfeado con café a media tarde."],["PATACÓN","🥪","Sándwich zuliano hecho con plátano verde frito en vez de pan.","En Maracaibo me comí un patacón gigante."],["MANDOCA","🍩","Rosca frita de maíz, plátano y papelón, típica del Zulia.","Las mandocas con queso son el desayuno maracucho."],["BIENMESABE","🥥","Postre dulce de coco.","La tía trajo bienmesabe para el cumpleaños."],["TIZANA","🍉","Bebida de muchas frutas picaditas.","En la playa vendían tizana bien fría."],["PERICO","🍳","Huevos revueltos con tomate y cebolla.","Arepa con perico, el desayuno de siempre."]],
corotos:[["COROTO","📦","Cualquier cosa u objeto.","Recoge tus corotos que nos vamos."],["VAINA","❓","Palabra comodín: una cosa, un asunto, lo que sea.","Pásame esa vaina que está en la mesa."],["FRANELA","👕","Camiseta.","Me puse la franela del equipo."],["CHOLAS","🩴","Sandalias, chanclas.","Fue a la bodega en cholas."],["TOBO","🪣","Balde, cubeta.","Llena el tobo de agua para lavar el carro."],["POCETA","🚽","Inodoro.","Se tapó la poceta otra vez."],["CHINCHORRO","🪢","Hamaca tejida.","Nada como una siesta en el chinchorro."],["COLETO","🧽","Trapo para limpiar el piso.","Pásale el coleto a la cocina."],["PIPOTE","🗑️","Bote o tanque de basura.","Saca la bolsa al pipote de la esquina."],["BOMBILLO","💡","Bombilla eléctrica.","Se quemó el bombillo del baño."],["CORNETA","🔊","Altavoz o parlante; también la bocina del carro.","Pon la corneta que llegó la música."],["MORRAL","🎒","Mochila.","Guarda los cuadernos en el morral."],["PIMPINA","🫙","Envase plástico grande para agua o gasolina.","Llenamos las pimpinas porque van a quitar el agua."],["MACUNDALES","🧳","Pertenencias, los corotos de uno.","Agarró sus macundales y se mudó."],["CAUCHO","🛞","Neumático, llanta del carro.","Se nos espichó un caucho en la autopista."],["COBIJA","🛏️","Manta para arroparse.","Hace frío, pásame la cobija."],["CHUPÓN","🍼","Chupete de bebé.","El bebé no se duerme sin el chupón."]],
calle:[["COLA","🚗","Aventón gratis en carro, o la fila para algo.","¿Me das la cola hasta el centro?"],["CHAMBA","💼","Trabajo.","Por fin consiguió chamba."],["REAL","💵","Dinero, plata.","No tengo real ni para el pasaje."],["TRANCA","🚦","Tráfico muy congestionado.","Había una tranca horrible en la autopista."],["CAMIONETICA","🚌","Autobús pequeño de transporte público.","Me fui en camionetica hasta el trabajo."],["POR PUESTO","🚕","Carro o bus que hace una ruta fija y cobra por persona.","Agarra un por puesto que te deja en la plaza."],["BUHONERO","🛒","Vendedor ambulante en la calle.","El buhonero vendía cargadores y cotufas."],["BACHAQUERO","🐜","Quien revende productos a sobreprecio.","El bachaquero tenía harina al doble de precio."],["MOTORIZADO","🏍️","Persona que anda en moto, como los repartidores.","El motorizado trajo la comida en diez minutos."],["LOCHA","🪙","Moneda de muy poco valor; se usa para decir que algo no vale nada.","Eso no vale ni una locha."],["ESTAR PELANDO","🥲","No tener dinero.","Estoy pelando hasta que me paguen."],["FIAO","📒","Comprado a crédito, para pagar después.","En la bodega me dan fiao hasta el viernes."],["CHANCHULLO","🕳️","Trampa o negocio turbio.","Esa rifa era un chanchullo."],["GUISO","🍲","Negocio ilegal o poco limpio.","Ese contrato huele a guiso."],["MATRACA","🤑","Soborno para evitar una multa o un trámite.","No te dejes matraquear en la alcabala."],["ENCHUFADO","🔌","Persona con conexiones o privilegios.","Consiguió el puesto porque está enchufado."],["RÚSTICO","🚙","Camioneta todoterreno.","Subimos al páramo en un rústico."],["CHIVO","🐐","Persona importante, el jefe.","Hay que hablar con el chivo de la empresa."]],
rumba:[["RUMBA","🎉","Fiesta.","Esta noche hay rumba en casa de Luis."],["BONCHE","🥳","Reunión o fiesta animada.","El bonche de ayer se prendió."],["BIRRA","🍻","Cerveza.","Tráete unas birras bien frías."],["PASAPALO","🍢","Bocadillo o tapita que se brinda en las fiestas.","Los pasapalos se acabaron primero que la música."],["RATÓN","🐭","Resaca, el malestar después de una fiesta.","Amanecí con un ratón horrible."],["PEA","🥴","Borrachera.","Agarró una pea y se durmió en el sofá."],["PARRANDA","🎶","Fiesta navideña con música que va de casa en casa.","La parranda llegó cantando aguinaldos."],["GAITA","🥁","Música zuliana típica de Navidad.","En diciembre suena gaita en todas partes."],["JOROPO","💃","Baile y música de los llanos con arpa, cuatro y maracas.","Bailaron joropo toda la noche."],["CUATRO","🪕","Guitarrita venezolana de cuatro cuerdas.","Mi tío toca el cuatro en las fiestas."],["MARACAS","🪇","Instrumento de percusión hecho con taparas y semillas.","Las maracas le dan el ritmo al joropo."],["AGUINALDO","🎁","Canción navideña venezolana.","Los niños cantaron un aguinaldo en el colegio."],["PONCHE CREMA","🥚","Licor navideño cremoso de huevo, leche y ron.","El ponche crema de mi abuela no tiene competencia."],["SE PRENDIÓ","🔥","Se animó la fiesta.","Cuando pusieron salsa, se prendió el bonche."],["ENGUAYABADO","💔","Triste por un amor que se fue, con despecho.","Está enguayabado escuchando canciones de despecho."],["DAR LATA","💋","Besarse apasionadamente.","Estaban dando lata en la esquina."],["RASCAO","🍹","Borracho, con unos tragos de más.","Salió rascao de la fiesta."],["CAÑA","🥃","Trago de bebida alcohólica.","Vamos a echarnos unas cañas para celebrar."]],
infancia:[["PAPAGAYO","🪁","Cometa o volantín que se vuela con hilo.","En vacaciones volábamos papagayo en el cerro."],["METRA","🔮","Canica.","Le gané todas las metras a mi primo."],["TROMPO","🌪️","Juguete que se hace girar con una cuerda.","Tenía el trompo más bailador del barrio."],["PERINOLA","🎯","Juguete de palo con una bola unida por un cordón, para ensartarla.","Hice cien seguidas con la perinola."],["TETERO","🍼","Biberón.","Prepárale el tetero al bebé."],["CHUPETA","🍭","Paleta de caramelo.","Me dieron una chupeta en el médico."],["CHUCHERÍA","🍬","Golosina, dulce o snack.","No comas tanta chuchería antes del almuerzo."],["PIÑATA","🪅","Figura llena de dulces que se rompe en los cumpleaños.","Todos corrieron cuando se rompió la piñata."],["CHAPITA","⚾","Béisbol callejero jugando con tapas de refresco.","Jugábamos chapita con un palo de escoba."],["LA ERE","🏃","Juego de perseguir y tocar al otro.","¡Tú la llevas! ¡Jugamos la ere!"],["CAIMANERA","⚽","Partido informal entre amigos.","Armamos una caimanera en la cancha."],["ESCONDITE","🙈","Juego de esconderse mientras uno cuenta.","Cuenta hasta cien que vamos a jugar escondite."],["PALITO MANTEQUILLERO","🪵","Juego de buscar un palito escondido guiándose por frío o caliente.","¡Caliente, caliente! Encontraste el palito mantequillero."]],

});const GAMES=[{g:BOMB,cat:"accion",c1:"#3f8a2e",c2:"#0f2a16",tag:"Pon bombas, rompe muros y gana: contra la máquina en 12 niveles o contra un amigo.",tags:["Contra la máquina","12 niveles","2 jugadores"],steps:["Mueve a tu personaje con el <b>joystick</b> (izquierda) y pon bombas con el <b>botón</b> (derecha). Las bombas explotan en <b>cruz</b>: rompen bloques y eliminan a quien toquen… <b>¡también a ti!</b>","Los bloques esconden poderes: <b>+1 bomba</b>, <b>+1 fuego</b>, <b>velocidad</b>, <b>escudo</b> (te salva de una explosión), <b>patada</b> (empuja las bombas al caminar contra ellas) y el raro <b>fuego máximo</b>.","Cada mundo tiene su truco: en el <b>Desierto</b> hay barriles de TNT que explotan en cadena, en la <b>Ciudad Neón</b> portales que te teletransportan y en el <b>Volcán</b> grietas de lava que avisan antes de hacer erupción. Cuando el tiempo llega a 0:00, la arena se cierra."],
goal:"Aventura: derrota a la máquina en los 12 niveles y gana hasta 3 estrellas en cada uno. Entre 2: gana quien quede vivo; la partida es al mejor de 3.",setup:"Contra la máquina juegas solo con los controles abajo. Entre 2, pongan el celular plano en la mesa: uno abajo y el otro arriba."},{g:DUEL,cat:"accion",c1:"#6a5ae0",c2:"#2a1d7a",tag:"Cada uno en su lado: esquiva, apunta y dispara cara a cara.",tags:["Contra la máquina","Acción","Al mejor de 3"],steps:["<b>Desliza</b> el dedo en la barra de tu zona para mover tu nave a los lados.","Toca <b>DISPARAR</b>. Tienes 3 balas que se recargan solas. Si disparas <b>mientras te mueves</b>, la bala sale en diagonal y rebota en las paredes.","Dispárale a los <b>poderes</b> que cruzan por el centro para ganarlos: triple disparo, ráfaga, escudo y vida extra. Las balas que chocan se anulan."],goal:"Cada uno tiene 3 vidas. Quien se queda sin vidas pierde la ronda. Gana el primero en ganar 2."},{g:HOCKEY,cat:"accion",c1:"#18a0b8",c2:"#0d4a73",
tag:"Rápido y a lo loco, como la mesa de aire de las maquinitas.",tags:["Contra la máquina","Reflejos","A 5 goles"],steps:["Cada uno pone <b>un dedo en su mitad</b> de la mesa y mueve su mazo.","Golpea el disco para meterlo en la <b>portería del otro</b>. Mientras más rápido lo golpeas, más fuerte sale.","No puedes cruzar la <b>línea del centro</b>. Defiende tu portería."],goal:"Gana el primero en meter 5 goles."},{g:CHESS,cat:"mesa",c1:"#8d99c7",c2:"#394478",tag:"Ajedrez completo, con todas las reglas.",tags:["Contra la máquina","Estrategia","Reglas oficiales"],steps:["Toca una pieza para ver a dónde puede moverse y luego toca la casilla de destino.","Están todas las reglas: <b>enroque</b>, captura <b>al paso</b> y <b>coronación</b> (tú eliges la pieza). Si tu rey está en jaque, solo te deja hacer jugadas que lo salven.","El jugador <b>rojo lleva las blancas</b> y empieza. En línea, cada uno ve sus piezas abajo."],
goal:"Gana quien dé jaque mate o si el rival se rinde. El ahogado, la falta de material, las 50 jugadas o la triple repetición son tablas.",setup:"En el mismo celular se turnan: las blancas van abajo."},{g:TRIKI,cat:"mesa",c1:"#ff6b8b",c2:"#7a2a8a",tag:"El clásico X y O: rápido, pero con estrategia.",tags:["Contra la máquina","Clásico","A 3 victorias"],steps:["En tu turno, toca una casilla vacía para poner tu <b style='color:#ff5a5f'>X</b> o tu <b style='color:#3da9fc'>O</b>.","Haz <b>3 en línea</b>: en fila, en columna o en diagonal.","Cada ronda empieza un jugador distinto."],goal:"Gana la partida el primero en ganar 3 rondas.",setup:"Se turnan en el mismo celular."},{g:LUDO,cat:"mesa",c1:"#ffb627",c2:"#2e9e6a",tag:"Tira el dado, saca tus fichas y llévalas a la meta.",tags:["Contra la máquina","2 a 4 jugadores","Suerte"],np:1,
steps:["Toca el <b>dado</b> en tu turno. Con un <b>6</b> sacas una ficha de tu casa.","Toca la ficha que quieres mover: las que se pueden mover <b>brillan</b>. Si caes sobre una ficha rival, la mandas a su casa. Las casillas con <b>estrella</b> y las de salida son seguras.","Si sacas 6, capturas o llegas a la meta, <b>tiras otra vez</b>. Con tres 6 seguidos pierdes el turno."],goal:"Gana el primero en llevar sus 4 fichas a la meta del centro.",setup:"Se turnan en el mismo celular. Con 3 o 4 jugadores se usan también Amarillo y Verde."},{g:CARDS,cat:"mesa",c1:"#ff5a5f",c2:"#3d8bfc",tag:"Quédate sin cartas antes que nadie. Cuidado con los +4.",tags:["Contra la máquina","2 a 4 jugadores","Cartas"],np:1,
steps:["Juega una carta del <b>mismo color o número</b> que la de la mesa. Los <b>comodines</b> sirven siempre y te dejan elegir el color.","Especiales: <b>⊘</b> salta al siguiente, <b>⇄</b> cambia el sentido, <b>+2</b> y <b>+4</b> hacen robar al siguiente y le quitan el turno. Si no tienes jugada, toca el mazo para robar.","Cuando te quede <b>una sola carta</b>, toca <b>¡ÚLTIMA!</b> rápido. Si se te olvida, robas 2."],goal:"Gana el primero que se quede sin cartas.",setup:"En el mismo celular, cuando le toca a otro le pasas el celular: tus cartas se esconden solas."},{g:CITY,cat:"mesa",c1:"#c9a44c",c2:"#1b2658",tag:"Compra la ciudad, cobra alquileres y conviértete en el empresario más rico.",tags:["2 a 6 jugadores","En línea","Beta · parte 3"],party:1,
steps:["Tira los dados y avanza por la ciudad. Cada vez que pasas por la <b>Estación Central</b> cobras $200.","Si caes en una propiedad libre puedes <b>comprarla</b> (si no, se <b>subasta</b>). Si es de otro, le pagas <b>alquiler</b>. Con un <b>distrito completo</b> cobras el doble y puedes <b>construir</b>: Local → Edificio → Torre → Complejo.","<b>Negocia</b> con los demás para completar distritos. Si te falta dinero, <b>hipoteca</b> o vende. Cuidado con los impuestos, los eventos y el <b>Centro de Detención</b>."],goal:"Modo por rondas: gana el mayor patrimonio al terminar. Modo clásico: gana el último que no quiebre.",setup:"En este celular se lo pasan en cada turno, o en línea cada uno juega desde el suyo. La partida se guarda sola: si alguien se desconecta, su lugar lo espera. <b>Beta, parte 3 de 5:</b> jugar contra la máquina llega en la parte 4."},{g:YNG,cat:"fiesta",c1:"#e11d48",c2:"#4c0d2e",tag:"Confiesa en secreto lo que has hecho… y cumple los retos si vas ganando.",
tags:["2 a 12 jugadores","En línea","Fiesta"],party:1,steps:["Por turnos, cada jugador elige una frase <b>«Yo nunca nunca…»</b> de entre 3 opciones, o <b>escribe la suya</b> (puede llevar foto o video).","Todos responden <b>en secreto</b>: 🙋 <b>Lo he hecho</b> o 🙅 <b>Nunca</b>. Cuando responden todos (o se acaba el tiempo), se revela a la vez quién lo ha hecho: cada «lo he hecho» suma <b>1 punto</b>.","Cada cierto número de preguntas llega la <b>hora del reto</b> para quien va ganando: si lo acepta, lo hace (con prueba opcional) y los demás <b>votan</b> si lo cumplió. Si se rinde o no lo cumple, suma puntos extra."],goal:"Al final gana quien más puntos tiene: el que más cosas ha hecho. Hay premios al más atrevido, al más santo y al rey de los retos.",setup:"En línea cada uno responde desde su celular y nadie ve tu respuesta hasta la revelación. En el mismo celular se lo pasan para responder en secreto. Las preguntas picantes (+18) vienen apagadas."},{g:POOL,cat:"mesa",c1:"#0f7a45",
c2:"#3b1d0d",tag:"Billar bola 8 con física real: apunta, elige la fuerza y el efecto.",tags:["Contra la máquina","En línea","Bola 8"],steps:["<b>Apunta</b> arrastrando el dedo sobre la mesa: el taco sigue tu dedo. Para ajustar poquito, usa la <b>rueda fina</b> de la izquierda. La guía te muestra a dónde va la bola que golpeas.","Para tirar, <b>baja la barra de fuerza</b> de la derecha y <b>suelta</b>: mientras más la bajes, más duro le pegas. Con el botón <b>Efecto</b> eliges dónde le pega el taco a la blanca: arriba sigue, abajo regresa y a los lados cambia el rebote.","Uno juega con las <b>lisas</b> (1-7) y el otro con las <b>rayadas</b> (9-15): lo decide la primera bola que alguien mete después del saque. Si metes una tuya, sigues. Si haces falta (meter la blanca, no tocar nada o tocar primero una bola del rival), el otro tiene <b>bola en mano</b> y puede poner la blanca donde quiera."],
goal:"Mete todas tus bolas y después la negra (8). Si metes la negra antes de tiempo o con falta, pierdes.",setup:"Contra la máquina o entre 2 en el mismo celular (se turnan). En línea, cada uno juega desde su celular y ves al rival apuntar en vivo."},{g:DUO,cat:"aventura",c1:"#ff7a1a",c2:"#1f74bd",tag:"Fuego y Agua tienen que ayudarse para escapar del templo.",tags:["Cooperativo",`${DUO_LEVELS.length} niveles`],lv:1,steps:["<b>Fuego</b> puede pisar lava y <b>Agua</b> puede pisar agua. El charco del otro color los elimina, y el <b>veneno verde</b> elimina a los dos.","Muévete con <b>◀ ▶</b> y salta con <b>▲</b>. Pon el celular <b>de lado</b>: Fuego usa los botones de la izquierda y Agua los de la derecha. En línea, cada uno maneja a su personaje.","Los <b>botones morados</b> abren compuertas mientras alguien está encima, y los <b>elevadores</b> suben cuando te paras en ellos. ¡Tienen que ayudarse!"],
goal:"Pasan el nivel cuando Fuego y Agua llegan a sus puertas. Junten todas las gemas y no se caigan para ganar 3 estrellas.",setup:"Pongan el celular de lado entre los dos. Con teclado: Fuego usa WASD y Agua las flechas."},{g:QVG,cat:"palabras",c1:"#ffcc00",c2:"#0b3d91",tag:"Adivina la jerga venezolana: lee la pista y arma la palabra con las letras.",tags:["Solo o en grupo","Venezuela","Palabras"],party:1,steps:["Lee la pista: qué significa la palabra (y un emoji que ayuda).","Toca las letras en orden para armar la palabra o frase. Si te equivocas, las letras vuelven.","Solo: ganas monedas, cartas para tu álbum y logros. Si te trancas, usa ayudas: ver un ejemplo, una letra o quitar las que sobran.","En grupo: en línea todos juegan a la vez y el más rápido gana más puntos; en el mismo celular se turnan."],
goal:"Solo: descubre las "+QV_LIST.length+" palabras y completa el álbum. También hay Trivia criolla y Viaje por Venezuela (estados, capitales y gentilicios). En grupo: gana quien sume más puntos.",setup:"Juega solo a tu ritmo, o en grupo en el mismo celular (se turnan) o en línea desde cada celular."},{g:HANG,cat:"palabras",c1:"#5b6cff",c2:"#2a2f7a",tag:"Adivina la palabra letra por letra antes de que se complete el muñeco.",tags:["Contra la máquina","2 a 8 jugadores","Palabras"],party:1,steps:["La palabra sale <b>al azar</b> (con una pista de categoría) o la <b>escribe un jugador</b> en secreto, por turnos.","En tu turno toca una letra. Si está, ganas un punto por cada vez que aparece y <b>sigues</b>. Si no está, se dibuja una parte del muñeco y le toca al siguiente.","Si te sabes la palabra, toca <b>Adivinar la palabra completa</b>: si aciertas ganas puntos extra; si fallas, pierdes 2 vidas."],

onexión por internet, esos servicios y los otros jugadores de la sala pueden ver tu dirección IP.</p>\n      <h3>4. Fotos, videos y voz</h3>\n      <p>Las fotos y videos de Botellita y Yo Nunca Nunca, y el chat de voz, van directo a los celulares de la sala. No se guardan en ningún servidor de Arena Mini, y las fotos y videos se borran de la partida al terminar el turno. Recuerda que otra persona siempre podría tomar una captura de pantalla: comparte solo lo que te sientas cómodo compartiendo.</p>\n      <h3>5. Otros servicios que usa la página</h3>\n      <p>La página está alojada en <b>GitHub Pages</b>, carga las letras desde <b>Google Fonts</b> y algunas herramientas desde <b>jsDelivr</b> y <b>unpkg</b>. Estos servicios pueden registrar datos técnicos como tu dirección IP según sus propias políticas. Arena Mini no usa herramientas de publicidad ni de rastreo.</p>\n      <h3>6. Errores y visitas</h3>\n      <p>Si algo falla en la página, se envía un reporte automático del error a <b>Supabase</b> para poder arreglarlo: el mensaje técnico del error, en qué juego y pantalla pasó, la versión de Arena Mini, el tipo de celular y navegador, y un número al azar que cambia cada día. También se cuenta una visita por día con ese mismo número, para saber cuántas personas usan la página. No se envía tu nombre, tus mensajes ni nada que te identifique. Los errores se borran después de 60 días.</p>\n      <h3>7. Donaciones</h3>\n      <p>Las donaciones son voluntarias y se procesan con <b>Stripe</b>. Al donar sales a una página segura de Stripe: Arena Mini nunca ve ni guarda los datos de tu tarjeta. Stripe pide tu correo para enviarte el recibo y procesa el pago según su propia política de privacidad. El desarrollador puede ver en Stripe la cantidad, la fecha, tu nombre y tu correo, y los usa solo para llevar las cuentas y, si hace falta, atender una devolución. En este celular solo queda guardado que ya apoyaste, para darte las gracias.</p>\n      <h3>8. Menores de edad</h3>\n      <p>Las preguntas picantes (+18) vienen apagadas y el anfitrión debe confirmar que todos son mayores de edad para activarlas. Si eres menor de 13 años, no publiques opiniones.</p>\n      <h3>9. Tus opciones</h3>\n      <p>Puedes editar o borrar tu opinión desde el juego, o borrar todas tus opiniones desde <b>Perfil → Borrar mis opiniones</b>. Si borras los datos de tu celular antes, se pierde el identificador anónimo y ya no podrás borrarlas tú mismo.</p>\n      <p><b>Contacto:</b> pronto agregaremos un correo para dudas y solicitudes de privacidad.</p>\n      <h3>10. Cambios</h3>\n      <p>Si esta política cambia, actualizaremos la fecha de arriba.</p>\n    </div>`,e)
